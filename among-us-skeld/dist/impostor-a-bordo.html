      } else {
        if (U.chance(0.4 + L.lie * 0.5)) this.reply(0.8, () => say('denyStrong', { accuser: S, area }, [{ type: 'deny' }, { type: 'accuse', who: S, reason: 'lie' }]), true);
        else this.reply(0.8, () => say('deny', { area }, [{ type: 'deny' }]), true);
        if (strong && U.chance(L.lie * 0.6) && !this.replied.has('counter' + S)) {
          this.replied.add('counter' + S);
          this.reply(2.2, () => say('counter', { who: S }, [{ type: 'accuse', who: S, reason: 'lie' }]), true);
        }
      }
      return;
    }
    if (p.isImp) {
      if (target.isImp) {
        if (!strong && U.chance(L.lie * 0.45) && !this.replied.has('defp' + T2)) {
          this.replied.add('defp' + T2);
          this.reply(1.5, () => say('defendPartner', { who: T2 }, [{ type: 'vouch', who: T2, reason: 'claim' }]));
        }
      } else if (U.chance(0.25 + L.lie * 0.2) && !this.replied.has('agree' + T2)) {
        this.replied.add('agree' + T2);
        this.reply(1.3, () => say('agree', { who: T2 }, [{ type: 'agree', who: T2 }]));
      }
      return;
    }
    let belief = w * this.trust(S);
    const myEv = (this.ev && this.ev[T2]) || [];
    const clearedByMe = myEv.some((e) => e.reason === 'together' || e.reason === 'alibi');
    if (clearedByMe && !STRONG[it.reason]) {
      belief *= 0.3;
      this.bump(S, 9, 'own');
    }
    const myVisual = myEv.some((e) => e.reason === 'visual');
    const iSawStrong = myEv.some((e) => STRONG[e.reason]);
    if (myVisual && !g.S.house.noVisualHardClear) {
      belief *= 0.12;
      this.bump(S, strong ? 25 : 6);
      if (!this.replied.has('vis' + T2)) {
        this.replied.add('vis' + T2);
        const e = myEv.find((x) => x.reason === 'visual');
        this.reply(0.9, () => say('vouch', { who: T2, reason: 'visual', task: e.task }, [{ type: 'vouch', who: T2, reason: 'visual' }]), true);
      }
    } else if (iSawStrong) {
      if (!this.replied.has('also' + T2)) {
        this.replied.add('also' + T2);
        this.reply(0.8, () => say('alsoSaw', { who: T2 }, [{ type: 'agree', who: T2 }]));
      }
    } else {
      const tog = this.togetherMap()[T2] || 0;
      const sawThere = it.area && this.sawTimes(T2).some((s) => s.area === it.area || M.isNear(s.area, it.area));
      if (sawThere) {
        belief *= 1.4;
        if (U.chance(0.45)) this.reply(1.1, () => say('confirm', { who: T2, area: it.area }, [{ type: 'agree', who: T2 }]));
      } else if (tog >= 25 && strong) {
        belief *= 0.35;
        if (!this.replied.has('tog' + T2)) {
          this.replied.add('tog' + T2);
          this.reply(1, () => say('vouch', { who: T2, reason: 'together' }, [{ type: 'vouch', who: T2, reason: 'together' }]));
        }
      } else if (pers.defend && !strong && U.chance(0.55) && !this.replied.has('proof' + T2)) {
        this.replied.add('proof' + T2);
        this.reply(1.1, () => say('askProof', { who: T2 }, [{ type: 'askProof' }]));
      } else if (pers.skeptic && U.chance(strong ? 0.25 : 0.4) && !this.replied.has('proof' + T2)) {
        this.replied.add('proof' + T2);
        this.reply(1.1, () => say('askProof', { who: T2 }, [{ type: 'askProof' }]));
      } else if (pers.follow > 0.5 && (mt.heat[T2] || 0) > 30 && U.chance(0.45) && !this.replied.has('agree' + T2)) {
        this.replied.add('agree' + T2);
        this.reply(1.2, () => say('agree', { who: T2 }, [{ type: 'agree', who: T2 }]));
      }
    }
    this.bump(T2, belief, strong ? 'claim' : 'social');
  };

  B.onVouch = function (S, it) {
    const me = this.p.id, T2 = it.who;
    if (T2 === me || this.p.isImp) return;
    const say = (kind, d, intents) => ({ text: this.say(kind, d), intents: intents || [] });
    const myEv = (this.ev && this.ev[T2]) || [];
    const strongE = myEv.find((e) => STRONG[e.reason]);
    if (strongE) {
      this.bump(S, 15);
      if (!this.replied.has('rev' + T2)) {
        this.replied.add('rev' + T2);
        this.reply(0.9, () => say('accuse', { who: T2, reason: strongE.reason, area: strongE.area, victim: strongE.victim }, [{ type: 'accuse', who: T2, reason: strongE.reason, strong: true }], { strong: true }), true);
      }
      return;
    }
    const w = it.reason === 'visual' ? 30 : it.reason === 'together' ? 16 : 9;
    this.bump(T2, -w * this.trust(S), it.reason === 'visual' ? 'claim' : 'social');
  };

  /* ---------- voto ---------- */
  /* inocentado por tarefa visual que um tripulante de confiança relatou no chat */
  B.clearedByVisual = function (id) {
    const mt = this.mt;
    if (!mt || this.g.S.house.noVisualHardClear) return false;
    return mt.msgs.some((m) => m.from !== id && m.intents.some((it) => it.type === 'vouch' && it.who === id && it.reason === 'visual') && this.trust(m.from) >= 0.5);
  };

  B.impTarget = function () {
    const g = this.g, mt = this.mt, me = this.p.id;
    let best = null, bs = -1e9;
    for (const id of mt.alive) {
      const q = g.players[id];
      if (id === me || q.isImp) continue;
      const s = (mt.heat[id] || 0) + (this.accusedMe[id] ? 25 : 0) + (id === this.scapegoat ? 12 : 0) + mt.votesOn(id) * 12;
      if (s > bs) {
        bs = s;
        best = id;
      }
    }
    return bs >= 18 ? best : null;
  };

  B.mVote = function () {
    const g = this.g, mt = this.mt, me = this.p.id, pers = this.pers;
    const alive = mt.alive.filter((id) => id !== me);
    if (this.p.isImp) {
      const partners = alive.filter((id) => g.players[id].isImp);
      for (const pid of partners) {
        const on = mt.votesOn(pid);
        if (on >= Math.ceil((mt.alive.length - 1) / 2) - 1 && on >= 2 && U.chance(this.lvl.bus)) return pid;
      }
      const t = this.impTarget();
      if (t != null) return t;
      const lead = mt.leading();
      if (lead && !g.players[lead.id].isImp && lead.count >= 2) return lead.id;
      return 'skip';
    }
    /* eliminação: quem já foi inocentado sai da lista; se sobram poucos, os que sobram pesam mais */
    const cleared = (id) => ((this.ev && this.ev[id]) || []).some((e) => e.reason === 'visual') || this.clearedByVisual(id);
    const impsLeft = g.S.rules.confirmEjects ? mt.impostorsLeft : g.S.room.impostors;
    const open = alive.filter((id) => !cleared(id));
    const elim = open.length > 0 && open.length <= impsLeft + 1 ? 22 : open.length <= impsLeft + 2 ? 10 : 0;
    const score = (id) => (this.susp[id] || 0) + (elim && open.includes(id) ? elim : 0) + pers.follow * (mt.heat[id] || 0) * 0.3 + mt.votesOn(id) * pers.follow * 7;
    const ranked = alive.map((id) => ({ id, s: score(id) })).sort((a, b) => b.s - a.s);
    if (AU.debug && AU.debug.trace) {
      this.why = ranked.slice(0, 3).map((r) => ({ id: r.id, s: Math.round(r.s), susp: Math.round(this.susp[r.id] || 0), chat: Math.round(this.chatDelta[r.id] || 0), carry: Math.round((this.carry[r.id] || 0) * 0.5), heat: mt.heat[r.id] || 0, votes: mt.votesOn(r.id), ev: ((this.ev && this.ev[r.id]) || []).map((e) => e.reason + ':' + Math.round(e.w)) }));
    }
    const top = ranked[0], second = ranked[1] || { s: -999 };
    if (!top) return 'skip';
    const thr = pers.thr * (this.skipLean > 2 ? 1.12 : 1);
    if (top.s >= thr && top.s - second.s >= 8) return top.id;
    if (pers.follow > 0.7) {
      const lead = mt.leading();
      if (lead && lead.count >= 2 && lead.id !== me && (this.susp[lead.id] || 0) > 12 && !cleared(lead.id)) return lead.id;
    }
    if (pers.hunch > 0.3 && top.s >= thr * 0.6 && U.chance(0.45)) return top.id;
    return 'skip';
  };

  B.mEnd = function (result) {
    const g = this.g;
    if (!this.mt) return;
    const conf = g.S.rules.confirmEjects;
    for (const q of g.players) {
      if (q.id === this.p.id) continue;
      this.carry[q.id] = U.clamp((this.susp[q.id] || 0) * 0.55, -45, 110);
    }
    if (result.ejected != null && conf && !this.p.isImp) {
      const ej = g.players[result.ejected];
      for (const [voter, target] of Object.entries(result.votes || {})) {
        if (+voter === this.p.id) continue;
        if (target === result.ejected) this.carry[voter] = (this.carry[voter] || 0) + (ej.isImp ? -10 : this.pers.skeptic ? 16 : 10);
      }
      if (ej.isImp) {
        for (const id of Object.keys(this.mt.defenders[result.ejected] || {})) this.carry[id] = (this.carry[id] || 0) + 22;
      } else {
        for (const id of Object.keys(this.mt.accusers[result.ejected] || {})) this.carry[id] = (this.carry[id] || 0) + 18;
      }
    }
    this.lastTop = this.p.isImp ? null : this.topSuspect();
    this.mt = null;
  };
})();

  <script>
/* Voz dos bots com IA nas reuniões.
   O motor de regras continua decidindo O QUE cada bot sabe, suspeita, afirma e vota (as "falas planejadas").
   Um diretor junta essas falas em rodadas e pede ao modelo de linguagem para escrevê-las como um chat de verdade,
   respondendo ao jogador e aos outros bots. Nos silêncios ele também dá a vez a quem tem motivo para falar
   (foi acusado, recebeu pergunta, desconfia de alguém, quer cobrar quem não falou).
   O modelo nunca vê quem é impostor: o impostor aparece só com a versão que ele conta. */
(function () {
  'use strict';
  const AU = window.AU;
  const U = AU.U, C = AU.C, M = AU.Map, T = AU.Talk;

  const STYLE = {
    analitico: 'raciocina em voz alta, cita salas e ordem dos acontecimentos, pede dados concretos',
    impulsivo: 'reage rápido e emotivo, acusa por impulso, às vezes escreve em CAPS',
    falador: 'fala bastante, faz várias perguntas, conta detalhe demais e às vezes sai do assunto',
    silencioso: 'responde curtíssimo, 1 a 4 palavras, só quando precisa',
    caotico: 'zoeiro, faz piada, usa kkkk, joga desconfiança de brincadeira',
    lider: 'organiza a conversa, chama cada um pelo nome, resume e propõe em quem votar ou pular',
    defensor: 'pede provas e defende quem é acusado sem evidência',
    cetico: 'desconfia de todo álibi, pergunta "quem confirma?", não engole resposta vaga',
    seguidor: 'concorda com quem parece saber, "+1", "faz sentido", raramente toma a frente',
    inexperiente: 'meio perdido, confunde nomes de sala, pergunta o básico, inseguro',
  };
  const TONE = {
    limpo: 'Escreva em português correto e educado, sem gírias pesadas, sem abreviações e sem palavrões.',
    casual: 'Estilo de chat de jogo online: quase tudo em minúsculas, abreviações (vc, tb, pq, tava, ngm, blz, sla), gírias de Among Us (sus, safe, skip, ventou, self report), pouca pontuação.',
    raiz: 'Bem informal e intenso, como lobby brasileiro: gírias (mano, pô, slk, véi, tá de sacanagem), abreviações, kkkk, CAPS quando acusa. Pode provocar, mas sem palavrões pesados nem ofensas.',
  };
  const EXAMPLE = [
    'Lipe: onde?',
    'Bia: elétrica, perto dos fios',
    'Rafa: quem tava pra aquele lado?',
    'Zé: eu tava no depósito com o azul',
    'Nina: confirmo, tava c ele',
    'Bia: vi o vermelho saindo de lá',
    'Beto: EU? tava na med fazendo scan',
    'Rafa: alguém viu o scan do beto?',
    'Nina: eu vi, safe',
    'Rafa: então não tem nada certo, vamo de skip?',
  ].join('\n');

  const REASON = {
    kill: 'viu matando', vent: 'viu usando o duto', shift: 'viu mudando de aparência', vanish: 'viu ficar invisível',

  const V = {
    active(mt) {

    who(g, id) {

    },
    area(a) {

    },

    system(g) {
      return [
        'Você escreve as mensagens de chat de vários jogadores numa partida de um jogo de dedução social igual a Among Us, na nave The Skeld. Eles estão numa reunião: conversam para descobrir o impostor e depois votam para ejetar alguém ou pular (skip).',
        'Como escrever:',
        '- Chat de jogo online de verdade, de jogadores brasileiros: mensagens curtas (até 120 caracteres), diretas, às vezes incompletas, reagindo ao que acabou de ser dito. Nada de narração, aspas, emojis, asteriscos ou descrição de ações.',

    scene(mt) {

        ? `Reunião: ${V.who(g, info.caller)} reportou o corpo de ${V.who(g, info.body.pid)}.` + (mt.facts.bodyArea ? ` Já disseram no chat que o corpo estava em ${V.area(mt.facts.bodyArea)}.` : ' Ainda não disseram onde estava o corpo.')

      const claimed = new Set(mt.msgs.filter((m) => m.intents.some((i) => i.type === 'claimLoc')).map((m) => m.from));

        `Vivos: ${alive}.`,
        dead ? `Fora do jogo: ${dead}.` : '',

        g.S.rules.confirmEjects ? `Impostores restantes: ${mt.impostorsLeft}.` : '',

      return mt.msgs.slice(-(n || 22)).map((m) => `${V.who(g, m.from)}: ${m.text}`).join('\n') || '(ninguém falou ainda)';
    },

      return `${V.who(b.g, p.id)} — ${pers.name}: ${STYLE[p.personality] || pers.desc}`;
    },

    /* Por que um bot desconfia de alguém, em poucas palavras (só com o que ele sabe). */
    reasonOf(b, id) {
      const ev = ((b.ev && b.ev[id]) || []).filter((e) => e.w > 0).sort((a, c) => c.w - a.w)[0];
      if (ev) {
        const t = { kill: 'você viu matando', vent: 'você viu no duto', shift: 'você viu mudando de forma', vanish: 'você viu sumindo', noscan: 'fingiu o scan', follow: 'ficou te seguindo', nearBody: 'estava perto do corpo', lastWith: 'estava com a vítima', withVictim: 'andava colado na vítima' }[ev.reason];

    notes(b) {

            if (e.reason === 'nearBody' && e.w >= 14) out.push('Viu ' + nm(+id) + ' perto de onde estava o corpo' + (e.area ? ' (' + V.area(e.area) + ')' : '') + ' pouco antes.');
            if (e.reason === 'together' && e.secs >= 20) out.push('Ficou um tempo junto de ' + nm(+id) + ' e nada aconteceu.');
          }

      }
      const recent = b.mem.seen.filter((s) => s.t1 >= b.graceT() && s.t1 >= info.t - 45 && s.via !== 'track' && g.players[s.who] && s.who !== p.id).slice(-5);
      for (const s of recent) out.push('Viu ' + nm(s.who) + ' em ' + V.area(s.area) + ' uns ' + Math.max(5, Math.round((info.t - s.t1) / 5) * 5) + 's antes da reunião' + (s.via === 'cams' ? ' (pelas câmeras)' : '') + '.');
      if (p.isImp) {

        const ranked = mt.alive.filter((id) => id !== p.id).map((id) => ({ id, s: b.susp[id] || 0 })).sort((a, c) => c.s - a.s);
        const tops = ranked.filter((x) => x.s >= 22).slice(0, 2);
        if (tops.length) out.push('Desconfia de: ' + tops.map((x) => nm(x.id) + ' (' + (x.s >= 60 ? 'muito' : x.s >= 35 ? 'bastante' : 'um pouco') + '; ' + V.reasonOf(b, x.id) + ')').join('; ') + '.');
        else out.push('Não tem suspeito claro.');
        const lean = b.voteLean();
        out.push(lean != null ? 'Está inclinado a votar em ' + nm(lean) + '.' : 'Tende a pular (skip) se ninguém trouxer prova.');
        const trusted = ranked.filter((x) => x.s <= -20).slice(0, 2);
        if (trusted.length) out.push('Confia em: ' + trusted.map((x) => nm(x.id)).join(', ') + '.');
      }
      const accusers = Object.keys(b.accusedMe || {}).map(Number);
      if (accusers.length) out.push('Foi acusado por: ' + accusers.map(nm).join(', ') + '.');
      return out.slice(0, 13);
    },

    /* Mensagens que cobram este bot desde a última vez que ele falou. */
    pending(mt, id) {
      const res = { accused: [], asked: [], mentioned: [] };
      for (let i = mt.msgs.length - 1, n = 0; i >= 0 && n < 16; i--, n++) {
        const m = mt.msgs[i];
        if (m.from === id) break;
        for (const it of m.intents) {
          if (it.who !== id) continue;
          if (it.type === 'accuse' && !res.accused.includes(m)) res.accused.push(m);
          else if (it.type === 'askWhere' && !res.asked.includes(m)) res.asked.push(m);
          else if ((it.type === 'mention' || it.type === 'sawAt' || it.type === 'quiet') && !res.mentioned.includes(m)) res.mentioned.push(m);
        }
      }
      return res;
    },

    said(mt, id) {
      return mt.msgs.filter((m) => m.from === id).slice(-3).map((m) => '"' + m.text + '"');
    },

    /* O que uma fala planejada pelo motor quer dizer, em linguagem natural. */
    describeBeat(mt, x) {
      const g = mt.g, nm = (id) => V.who(g, id);
      const parts = [];
      for (const it of x.intents) {
        switch (it.type) {
          case 'accuse': parts.push('acusar ' + nm(it.who) + ' (' + (REASON[it.reason] || 'suspeito') + (it.area ? ', ' + V.area(it.area) : '') + ')' + (it.strong ? ' — tem certeza' : '')); break;
          case 'vouch': parts.push('defender ' + nm(it.who) + ' (' + (VOUCH[it.reason] || 'acha inocente') + ')'); break;
          case 'claimLoc': parts.push('dizer onde estava: ' + (it.rooms || []).map(V.area).join(' → ') + (it.with && it.with.length ? ', com ' + it.with.map(nm).join(', ') : '')); break;
          case 'sawAt': parts.push('dizer que viu ' + nm(it.who) + ' em ' + V.area(it.area)); break;
          case 'askWhere': parts.push('perguntar a ' + nm(it.who) + ' onde estava'); break;
          case 'askAll': parts.push('pedir para cada um dizer onde estava'); break;
          case 'askBody': parts.push('perguntar onde estava o corpo'); break;
          case 'askProof': parts.push('pedir prova'); break;
          case 'deny': parts.push('negar que foi ele'); break;
          case 'skip': parts.push('sugerir pular (skip)'); break;
          case 'agree': parts.push('concordar sobre ' + nm(it.who)); break;
          case 'reportInfo': parts.push('contar que achou o corpo de ' + nm(it.victim) + ' em ' + V.area(it.area)); break;
          case 'bodyArea': parts.push('dizer que o corpo estava em ' + V.area(it.area)); break;
          case 'quiet': parts.push('cobrar ' + nm(it.who) + ', que está quieto'); break;
          default: break;
        }
      }
      const k = x.meta.kind;
      if (k === 'vote') parts.unshift(x.meta.vote === 'skip' ? 'avisar que votou skip (' + (x.meta.reason || 'sem prova') + ')' : 'avisar que votou em ' + nm(x.meta.vote) + ' (' + (x.meta.reason || 'suspeito') + ')');
      let s = parts.length ? parts.join('; ') : 'comentar';
      if (x.meta.srcFrom != null && x.meta.srcText) s += ' — respondendo a ' + g.players[x.meta.srcFrom].name + ' ("' + x.meta.srcText.slice(0, 90) + '")';
      return s;
    },

    describeMotive(mt, b, m) {
      const g = mt.g, nm = (id) => V.who(g, id), hp = g.human;
      const quote = (msg) => g.players[msg.from].name + ': "' + msg.text.slice(0, 90) + '"';
      switch (m.kind) {
        case 'answerHuman': {
          const msg = m.msg;
          const it = msg.intents;
          let how = 'responda com o que você sabe; se não souber, diga que não viu nada';
          if (it.some((i) => i.type === 'askWhere' && i.who === b.p.id)) how = 'diga onde esteve e o que fazia';
          else if (it.some((i) => i.type === 'accuse' && i.who === b.p.id)) how = 'defenda-se, com o seu álibi';
          else if (it.some((i) => i.who === b.p.id)) how = 'responda ao que falaram de você';
          else if (it.some((i) => i.type === 'claimLoc')) how = 'reaja ao álibi: confirme só se viu, duvide ou pergunte algo';
          else if (it.some((i) => i.type === 'accuse')) how = 'diga se concorda, se viu algo ou peça prova';
          return 'responder DIRETAMENTE a ' + (hp ? hp.name : 'quem falou') + ', que escreveu: "' + msg.text.slice(0, 120) + '" — ' + how + '.';
        }
        case 'defend': return 'foi acusado (' + m.by.map(quote).join(' / ') + '): defenda-se com o seu álibi e questione a acusação.';
        case 'answer': return 'perguntaram onde você estava (' + m.by.map(quote).join(' / ') + '): responda.';
        case 'mentioned': return 'falaram de você (' + m.by.map(quote).join(' / ') + '): responda.';
        case 'plead': return 'você está levando votos: tente convencer a galera a não votar em você.';
        case 'claim': return 'você ainda não disse onde estava: conte.';
        case 'pressClaims': return 'cobre quem ainda não disse onde estava: ' + m.who.map((id) => g.players[id].name).join(', ') + '.';
        case 'askHuman': return 'pergunte a ' + nm(hp.id) + ' onde estava e com quem (ainda não disse).';
        case 'push': return b.p.isImp
          ? 'puxe a conversa para ' + nm(m.who) + ', de leve, com dúvida, sem inventar prova.'
          : 'diga o que acha de ' + nm(m.who) + ' (' + V.reasonOf(b, m.who) + '): pressione ou peça explicação.';
        case 'react': return 'reaja à mensagem de ' + quote(m.msg) + ': concorde, duvide, pergunte algo ou complemente com o que você sabe.';
        case 'summary': return 'resuma a situação em uma frase e proponha em quem votar ou pular, conforme o que você pensa.';
        case 'joke': return 'solte um comentário descontraído rápido, sem atrapalhar.';
        default: return 'fale algo útil para a discussão.';
      }
    },

    speakerBlock(mt, s, i) {
      const b = s.b, id = b.p.id;
      const said = V.said(mt, id);
      const pend = V.pending(mt, id);
      const lines = ['### ' + (i + 1) + '. ' + V.persona(b), 'Só ' + b.p.name + ' sabe:'];
      V.notes(b).forEach((l) => lines.push('- ' + l));
      lines.push(said.length ? 'Já disse nesta reunião: ' + said.join(' / ') : 'Ainda não falou nesta reunião.');
      const cob = pend.accused.concat(pend.asked).slice(0, 2);
      if (cob.length) lines.push('Cobraram ' + b.p.name + ' e ainda não respondeu: ' + cob.map((m) => mt.g.players[m.from].name + ': "' + m.text.slice(0, 80) + '"').join(' / '));
      const todo = s.beats.map((x) => 'o sentido é: ' + V.describeBeat(mt, x) + '. Frase-guia (reescreva do seu jeito): "' + x.text + '"');
      if (s.motive) todo.push(V.describeMotive(mt, b, s.motive));
      lines.push('Nesta vez, ' + b.p.name + ' deve: ' + todo.join(' E TAMBÉM ') );
      return lines.join('\n');
    },

    /* Linhas "Nome: texto" da resposta, na ordem, até 2 por personagem. */
    parseRound(text, round) {
      const out = [];
      const count = {};
      const keys = round.map((s) => ({ s, n: U.norm(s.b.p.name), c: U.norm(C.COLOR[s.b.p.color].name) }));
      const rows = String(text || '').split(/\n+/);
      for (const raw of rows) {
        const line = raw.replace(/^[\s*\-•>#\d.)]+/, '').replace(/\*\*/g, '').trim();
        const m = line.match(/^([^:]{1,40}):\s*(.+)$/);
        if (!m) continue;
        const who = U.norm(m[1].replace(/\([^)]*\)/g, '').replace(/[@*"]/g, '')).trim();
        const k = keys.find((x) => x.n === who) || keys.find((x) => x.c === who) || keys.find((x) => who.startsWith(x.n + ' '));
        if (!k) continue;
        const id = k.s.b.p.id;
        if ((count[id] || 0) >= 2) continue;
        let t = tidy(m[2]);
        t = t.replace(new RegExp('^' + escapeRe(k.s.b.p.name) + '\\s*[:\\-–—]\\s*', 'i'), '');
        if (t.length < 1 || /^\(?(nada|sem resposta|\.\.\.)\)?$/i.test(t)) continue;
        count[id] = (count[id] || 0) + 1;
        out.push({ s: k.s, text: t });
      }
      if (!out.length && round.length === 1) {
        const only = rows.map((l) => l.trim()).filter(Boolean)[0];
        if (only) out.push({ s: round[0], text: tidy(only.replace(/^[^:]{1,24}:\s*/, '')) });
      }
      return out;
    },

    /* Intenções de uma fala livre: só as que batem com o que o bot sabe (o modelo não decide o jogo). */
    validIntents(b, text, motive, mt) {
      const g = b.g, p = b.p, id = p.id;
      const parsed = T.parse(text, g, { self: id, addressed: motive && motive.msg ? motive.msg.from : mt.lastSpeaker });
      const out = [];
      for (const it of parsed) {
        switch (it.type) {
          case 'accuse':
            if (it.who === id || !g.players[it.who] || !g.players[it.who].alive) break;
            if (p.isImp ? !g.players[it.who].isImp : (b.susp[it.who] || 0) >= 18) out.push(Object.assign({}, it, { strong: false, reason: STRONGS[it.reason] ? 'sus' : it.reason }));
            break;
          case 'vouch':
            if (p.isImp || (b.susp[it.who] || 0) <= -8) out.push(it);
            break;
          case 'claimLoc': {
            const al = b.getAlibi();
            out.push({ type: 'claimLoc', rooms: al.rooms, with: al.with != null ? [al.with] : [] });
            break;
          }
          case 'sawAt':
            if (p.isImp || b.sawTimes(it.who).some((s) => s.area === it.area || M.isNear(s.area, it.area))) out.push(it);
            break;
          case 'bodyArea':
            if (b.knowsBody && it.area === b.knowsBody) out.push(it);
            break;
          default:
            out.push(it);
        }
      }
      return out;
    },

    director(mt) {
      return new Director(mt);
    },
  };
  const STRONGS = { kill: 1, vent: 1, shift: 1, vanish: 1 };

  class Director {
    constructor(mt) {
      this.mt = mt;
      this.g = mt.g;
      this.beats = [];
      this.busy = false;
      this.calls = 0;
      this.fails = 0;
      this.nextRoundAt = 0;
      this.free = {};
      this.humanMsg = null;
      this.aiLines = 0;
    }
    get webllm() {
      return AU.LLM.provider === 'webllm';
    }
    maxCalls() {
      return this.webllm ? 12 : 26;
    }
    on() {
      return V.active(this.mt) && this.calls < this.maxCalls() && this.fails < 3;
    }
    accepts(meta) {
      if (!this.on()) return false;
      const mode = this.g.S.ui.aiChat;
      return mode === 'full' || (mode === 'replies' && !!meta.toHuman);
    }
    enqueue(b, m, meta) {
      const mt = this.mt;
      const pri = meta.toHuman ? 3 : meta.direct ? 2 : meta.important ? 1 : 0;
      this.beats.push({ b, text: m.text, intents: m.intents || [], meta, at: mt.t, pri, until: Math.max(mt.t, mt.durI) + (pri >= 2 ? 22 : pri ? 30 : 16) });
    }
    onHuman(msg) {
      if (!V.active(this.mt)) return;
      this.humanMsg = msg;
      /* espera um instante para juntar as reações do motor a esta mensagem na mesma rodada */
      this.nextRoundAt = this.mt.t + 0.45;
    }
    pendingLines() {
      return this.mt.sched.filter((x) => x.dir).length;
    }
    /* Fala do motor sem passar pela IA (IA fora do ar, lenta ou sem resposta para ela). */
    postRaw(x, delay) {
      const mt = this.mt, p = x.b.p;
      mt.schedule(delay || 0.2, x.b, () => {
        if (!p.alive || mt.closed) return;
        mt.post(p, x.text, x.intents);
      }, { ttl: 15, dir: true, force: x.pri >= 2 });
    }
    flush() {
      const list = this.beats;
      this.beats = [];
      list.forEach((x, i) => this.postRaw(x, 0.2 + i * 0.4));
    }

    tick() {
      const mt = this.mt, t = mt.t;
      if (mt.phase !== 'discussion' && mt.phase !== 'voting') return;
      for (const x of this.beats.slice()) {
        if (t <= x.until && x.b.p.alive) continue;
        this.beats.splice(this.beats.indexOf(x), 1);
        if (x.pri >= 1 && x.b.p.alive) this.postRaw(x);
      }
      if (this.busy || t < this.nextRoundAt) return;
      if (!this.on()) {
        if (this.beats.length) this.flush();
        return;
      }
      if (this.pendingLines() > 1 && !this.humanMsg) return;
      const round = this.plan();
      if (round) this.run(round);
    }

    /* Monta a próxima rodada: falas planejadas primeiro, depois quem tem motivo para falar. */
    plan() {
      const mt = this.mt, g = this.g, t = mt.t;
      const maxSp = this.webllm ? 2 : 4;
      const sp = new Map();
      const add = (b, beat, motive) => {
        const id = b.p.id;
        let s = sp.get(id);
        if (!s) {
          if (sp.size >= maxSp) return false;
          s = { b, beats: [], motive: null };
          sp.set(id, s);
        }
        if (beat) {
          if (s.beats.length >= 2) return false;
          s.beats.push(beat);
        }
        if (motive && !s.motive) s.motive = motive;
        return true;
      };
      const taken = [];
      const due = this.beats.filter((x) => x.at <= t + 0.01 && x.b.p.alive).sort((a, c) => c.pri - a.pri || a.at - c.at);
      for (const x of due) if (add(x.b, x)) taken.push(x);
      const mode = g.S.ui.aiChat;
      const hm = this.humanMsg;
      if (hm) {
        this.humanMsg = null;
        const already = [...sp.values()].filter((s) => s.beats.some((x) => x.meta.toHuman)).length;
        const want = Math.max(1, Math.min(3, maxSp) - already);
        let n = 0;
        for (const q of this.responders(hm)) {
          if (n >= want) break;
          if (sp.has(q.id) && sp.get(q.id).beats.some((x) => x.meta.toHuman)) continue;
          if (add(q.brain, null, { kind: 'answerHuman', msg: hm })) n++;
        }
      } else if (mode === 'full' && sp.size < 2 && t > mt.durI + 2) {
        const quiet = t - mt.lastMsgT;
        if (quiet > (mt.phase === 'voting' ? 4.5 : 2.2)) {
          const ms = this.motives().filter((m) => !sp.has(m.b.p.id));
          const n = sp.size ? 1 : U.chance(0.6) ? 2 : 1;
          for (const m of ms.slice(0, n)) add(m.b, null, m);
        }
      }
      if (!sp.size) return null;
      this.beats = this.beats.filter((x) => !taken.includes(x));
      for (const s of sp.values()) {
        if (!s.motive) continue;
        this.free[s.b.p.id] = (this.free[s.b.p.id] || 0) + 1;
        if (s.motive.kind === 'askHuman') {
          mt.askedHumanAt = t;
          mt.askedHumanBy = s.b.p.id;
        }
      }
      const rank = (s) => (s.beats.some((x) => x.meta.toHuman) || (s.motive && s.motive.kind === 'answerHuman') ? 2 : 0);
      return [...sp.values()].sort((a, c) => rank(c) - rank(a));
    }

    /* Quem responde ao jogador: quem foi citado, quem ele cobrou, quem sabe algo do assunto. */
    responders(msg) {
      const mt = this.mt, g = this.g, hp = g.human;
      const out = [];
      const add = (p) => {
        if (p && p.alive && p.brain && p !== hp && !out.includes(p)) out.push(p);
      };
      const intents = msg.intents || [];
      const n = U.norm(msg.text);
      for (const it of intents) if (it.type === 'askWhere' && it.who != null) add(g.players[it.who]);
      for (const it of intents) if (it.who != null && ['accuse', 'vouch', 'sawAt', 'mention'].includes(it.type)) add(g.players[it.who]);
      if (/\b(vc|voce|tu|cê|ce)\b/.test(n) && mt.lastToHuman != null) add(g.players[mt.lastToHuman]);
      for (const it of intents) {
        if (it.type !== 'accuse' || it.who == null) continue;
        add(mt.alive.map((id) => g.players[id]).find((q) => q.brain && !q.isImp && q.id !== it.who && ((q.brain.ev && q.brain.ev[it.who]) || []).some((e) => Math.abs(e.w) >= 14)));
      }
      if (intents.some((i) => i.type === 'claimLoc')) {
        add(mt.alive.map((id) => g.players[id]).find((q) => q.brain && q !== hp && q.brain.sawTimes && q.brain.sawTimes(hp.id).length));
      }
      const general = !intents.some((i) => i.who != null) || intents.some((i) => i.type === 'askWho' || i.type === 'askAll');
      if (out.length < (general ? 2 : 1)) {
        const pool = mt.alive.map((id) => g.players[id]).filter((q) => q.brain && q !== hp && !out.includes(q) && !mt.typing.has(q.id));
        const pick = () => U.weighted(pool.filter((q) => !out.includes(q)), (q) => 0.2 + q.brain.pers.talk + (q.brain.pers.leader || q.brain.pers.skeptic ? 0.4 : 0) + (q.id === mt.lastSpeaker ? 0.3 : 0));
        add(pick());
        if (general && out.length < 2) add(pick());
      }
      return out.slice(0, 3);
    }

    /* Quem tem motivo para falar agora e qual. */
    motives() {
      const mt = this.mt, g = this.g, t = mt.t, hp = g.human;
      const bots = mt.alive.map((id) => g.players[id]).filter((q) => q.brain && !q.isHuman);
      const recent = mt.msgs.slice(-3).map((m) => m.from);
      const claimed = new Set(mt.msgs.filter((m) => m.intents.some((i) => i.type === 'claimLoc')).map((m) => m.from));
      const unclaimed = mt.alive.filter((id) => !claimed.has(id));
      const out = [];
      for (const q of bots) {
        const b = q.brain, id = q.id;
        if (mt.typing.has(id)) continue;
        const pend = V.pending(mt, id);
        const cand = [];
        if (pend.accused.length) cand.push({ kind: 'defend', by: pend.accused.slice(0, 2), s: 85 });
        if (pend.asked.length) cand.push({ kind: 'answer', by: pend.asked.slice(0, 2), s: 80 });
        if (pend.mentioned.length) cand.push({ kind: 'mentioned', by: pend.mentioned.slice(0, 2), s: 45 });
        const cap = 1 + Math.round(b.pers.talk * 3);
        if (!cand.length && (this.free[id] || 0) >= cap) continue;
        if (mt.phase === 'voting' && mt.votesOn(id) >= 2 && !recent.includes(id)) cand.push({ kind: 'plead', s: 75 });
        if (!claimed.has(id) && t > mt.durI + 6) cand.push({ kind: 'claim', s: 38 + b.pers.talk * 20 });
        const others = unclaimed.filter((x) => x !== id);
        if ((b.pers.leader || b.pers.skeptic) && others.length && t > mt.durI + 8) cand.push({ kind: 'pressClaims', who: others.slice(0, 3), s: 48 });
        if (hp && hp.alive && !mt.humanClaimed && t > mt.durI + 9 && (mt.askedHumanAt == null || t - mt.askedHumanAt > 20) && b.pers.talk >= 0.45) cand.push({ kind: 'askHuman', s: 55 });
        let top = null;
        if (q.isImp) top = b.scapegoat != null && g.players[b.scapegoat].alive ? { id: b.scapegoat, s: 36 } : null;
        else {
          const ts = b.topSuspect();
          if (ts && ts.s >= Math.min(b.pers.thr * 0.8, 40)) top = ts;
        }
        if (top) cand.push({ kind: 'push', who: top.id, s: 30 + Math.min(40, top.s / 2) });
        if (b.pers.leader && mt.msgs.length > 8) cand.push({ kind: 'summary', s: 32 });
        const last = mt.msgs.slice().reverse().find((m) => m.from !== id);
        if (last) cand.push({ kind: 'react', msg: last, s: 24 + b.pers.talk * 22 });
        if (b.pers.offtopic && U.chance(b.pers.offtopic * 0.4)) cand.push({ kind: 'joke', s: 18 });
        if (!cand.length) continue;
        cand.sort((a, c) => c.s - a.s);
        const m = cand[0];
        out.push(Object.assign({ b, score: m.s + U.rf(0, 18) + b.pers.talk * 10 - (recent.includes(id) ? 35 : 0) }, m));
      }
      return out.sort((a, c) => c.score - a.score);
    }

    prompt(round) {
      const mt = this.mt, g = this.g, hp = g.human;
      const last = mt.msgs[mt.msgs.length - 1];
      return [
        V.scene(mt),
        '',
        'Chat da reunião até agora (mais antigo primeiro):',
        V.transcript(mt, this.webllm ? 12 : 24),
        '',
        'Agora falam, nesta ordem:',
        round.map((s, i) => V.speakerBlock(mt, s, i)).join('\n\n'),
        '',
        'Regras desta rodada:',
        '- Escreva a próxima mensagem de cada personagem acima, continuando o chat a partir da última mensagem' + (last ? ' (' + g.players[last.from].name + ': "' + last.text.slice(0, 80) + '")' : '') + '.',
        '- Quando está escrito "o sentido é", mantenha exatamente os fatos (quem, onde, o quê), mas com as palavras e o jeito do personagem, ligando com o que acabou de ser dito.',
        '- Nas outras falas, siga só o objetivo e o que o personagem sabe. ' + (hp ? hp.name + ' é um jogador como os outros: responda e pergunte para ele também.' : ''),
        '- Um personagem pode responder ou citar a mensagem de outro desta mesma rodada.',
        '- Cada um escreve 1 mensagem (no máximo 2 curtas, se ficar mais natural quebrar). Até 120 caracteres cada. Não repita frases já ditas.',

  /* Cor do nome legível sobre o balão branco: cores claras usam o tom de sombra, escurecido. */
  function readable(col) {
    const hex = col.hex.replace('#', '');
    const r = parseInt(hex.slice(0, 2), 16), gg = parseInt(hex.slice(2, 4), 16), b = parseInt(hex.slice(4, 6), 16);
    const lum = (0.299 * r + 0.587 * gg + 0.114 * b) / 255;
    if (lum < 0.62) return col.hex;
    const sh = col.shade.replace('#', '');
    const f = 0.62;
    const c = (i) => Math.round(parseInt(sh.slice(i, i + 2), 16) * f).toString(16).padStart(2, '0');
    return '#' + c(0) + c(2) + c(4);
  }

  function mentionsHuman(g, text) {
    const hp = g.human;
    if (!hp) return false;
    const n = ' ' + U.norm(text) + ' ';
    const al = [U.norm(hp.name)].concat(C.COLOR[hp.color].alias.map(U.norm)).filter((a) => a.length >= 2);
    return al.some((a) => new RegExp('(^|[^a-z0-9])' + a.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '($|[^a-z0-9])').test(n));
  }

  /* Uma mensagem do chat (usada na reunião e no histórico). */
  function msgElement(g, msg) {
    const p = g.players[msg.from];
    const col = C.COLOR[p.color];
    const mention = !msg.fromHuman && mentionsHuman(g, msg.text);
    return h('div', { class: 'mt-msg' + (msg.fromHuman ? ' mine' : '') + (msg.ghost ? ' ghost' : '') + (mention ? ' mention' : '') },

      h('div', { class: 'mt-msg-body' },
        h('div', { class: 'mt-msg-name', style: { color: readable(col) } }, p.name + (msg.ghost ? ' 👻' : '')),
        h('div', { class: 'mt-msg-text' }, msg.text)));

  /* Quadro de álibis: resumo do que cada um disse e do que disseram sobre ele (só informação pública do chat). */

  /* ---------------- interface ---------------- */
  class MeetingUI {

  /* Histórico: conversa e quadro de uma reunião já encerrada. */
  function historyElement(g, mt) {
    const info = mt.info;
    const title = info.kind === 'report' ? `Reunião ${info.index}: ${g.players[info.caller].name} reportou o corpo de ${g.players[info.body.pid].name}` : `Reunião ${info.index}: emergência chamada por ${g.players[info.caller].name}`;

    weapons: ['#383e54', '#33384d', 'plates'],
    o2: ['#2f4b44', '#29433d', 'tiles'],
    navigation: ['#32405a', '#2d3a52', 'plates'],
    shields: ['#3a3e57', '#343850', 'hexes'],
    comms: ['#373d4f', '#323848', 'tiles'],
  };
  const SHIELD_FX = { x: 101.5, y: 55.6 };
  const LABELS = {
    cafeteria: [69, 23.3], upperEngine: [16, 18.6], lowerEngine: [16, 52.4], reactor: [10.6, 30.6],
    security: [27.5, 38.5], medbay: [45.5, 32.5], electrical: [43, 46.8], storage: [63, 54.2],
    admin: [80, 34.35], o2: [90, 25.2], weapons: [100, 15.6], navigation: [122.9, 42.4],
    shields: [101.5, 63.8], comms: [81, 68.4],
  };
  const WALL = '#141925', FACE = '#3b4560', FACE_HI = '#56627f';

  function build(PX) {
    const cv = document.createElement('canvas');
    cv.width = W * PX;
    cv.height = H * PX;
    const c = cv.getContext('2d');
    const P = PX;
    const D = mkDraw(c, P);

    /* piso */
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      if (!M.isFloor(x, y)) continue;
      const a = M.AREAS[M.areaIdx[y * W + x]];
      if (a.kind === 'room') {
        const [base, alt, kind] = FLOORS[a.id] || [a.floor, a.floor, 'tiles'];
        floorTile(c, P, x, y, base, alt, kind);
      } else {
        c.fillStyle = (x + y) % 2 ? '#2c3241' : '#2a303e';
        c.fillRect(x * P, y * P, P, P);
      }
    }
    /* faixa central dos corredores */
    for (const cdr of M.CORRIDORS) {
      for (const [x, y, w, h] of cdr.rects) {
        c.fillStyle = 'rgba(255,208,70,0.07)';
        if (w >= h) c.fillRect(x * P, (y + h / 2 - 0.08) * P, w * P, 0.16 * P);
        else c.fillRect((x + w / 2 - 0.08) * P, y * P, 0.16 * P, h * P);
        c.fillStyle = 'rgba(0,0,0,0.18)';
        if (w >= h) {
          c.fillRect(x * P, y * P, w * P, 0.18 * P);
          c.fillRect(x * P, (y + h - 0.18) * P, w * P, 0.18 * P);
        } else {
          c.fillRect(x * P, y * P, 0.18 * P, h * P);
          c.fillRect((x + w - 0.18) * P, y * P, 0.18 * P, h * P);
        }
      }
    }
    /* paredes (visão 3/4: a parede de cima mostra a face) */
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      if (M.isFloor(x, y)) continue;
      let near = false;
      for (let dy = -1; dy <= 1 && !near; dy++) for (let dx = -1; dx <= 1; dx++) if (M.isFloor(x + dx, y + dy)) near = true;
      if (!near) continue;
      c.fillStyle = WALL;
      c.fillRect(x * P, y * P, P, P);
      if (M.isFloor(x, y + 1)) {
        c.fillStyle = FACE;
        c.fillRect(x * P, y * P + P * 0.2, P, P * 0.8);
        c.fillStyle = FACE_HI;
        c.fillRect(x * P, y * P + P * 0.2, P, P * 0.1);
        c.fillStyle = 'rgba(0,0,0,0.28)';
        c.fillRect(x * P, y * P + P * 0.86, P, P * 0.14);
        if (x % 3 === 0) {
          c.fillStyle = 'rgba(0,0,0,0.18)';
          c.fillRect(x * P, y * P + P * 0.3, P * 0.06, P * 0.56);
        }
      }
    }
    /* contorno entre piso e parede (os cantos em diagonal são desenhados depois) */
    c.strokeStyle = '#0a0d15';
    c.lineWidth = 3;
    const seg = (x1, y1, x2, y2) => {
      c.beginPath();
      c.moveTo(x1 * P, y1 * P);
      c.lineTo(x2 * P, y2 * P);
      c.stroke();
    };
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      if (!M.isFloor(x, y)) continue;
      const a = M.AREAS[M.areaIdx[y * W + x]];
      const diag = (nx, ny) => {
        if (!a || !a.cut) return false;
        const [rx, ry, rw, rh] = a.rect;
        return nx >= rx && ny >= ry && nx < rx + rw && ny < ry + rh && M.inCut(a, nx, ny);
      };
      if (!M.isFloor(x - 1, y) && !diag(x - 1, y)) seg(x, y, x, y + 1);
      if (!M.isFloor(x + 1, y) && !diag(x + 1, y)) seg(x + 1, y, x + 1, y + 1);
      if (!M.isFloor(x, y + 1) && !diag(x, y + 1)) seg(x, y + 1, x + 1, y + 1);
    }
    for (const r of M.ROOMS) if (r.cut) drawCuts(c, P, r);
    drawRooms(D, c, P);
    drawStations(D, c, P);
    drawVents(D);
    /* nomes das salas, em pontos livres de móveis e consoles */
    c.textAlign = 'center';
    c.textBaseline = 'top';
    c.font = `800 ${P * 0.74}px "Chakra Petch", system-ui, sans-serif`;
    c.fillStyle = 'rgba(230,236,255,0.17)';
    for (const r of M.ROOMS) {
      const [x, y, w] = r.rect;
      const [lx, ly] = LABELS[r.id] || [x + w / 2, y + 0.35];
      c.fillText(r.name.toUpperCase(), lx * P, ly * P);
    }
    return cv;
  }

  /* Canto chanfrado: a parede segue uma diagonal lisa em vez da escadinha de tiles.
     Coordenadas locais: du = distância à parede lateral, dv = distância à parede de cima/baixo. */
  const WINDOWS = { navigation: true, weapons: true };
  function drawCuts(c, P, r) {
    const [x, y, w, h] = r.rect;
    const fl = FLOORS[r.id] || [r.floor, r.floor, 'tiles'];
    /* recorte: anel da sala, sem invadir o piso de corredores vizinhos */
    const clipRoom = () => {
      c.beginPath();
      c.rect((x - 1) * P, (y - 1) * P, (w + 2) * P, (h + 2) * P);
      for (let ty = y - 1; ty <= y + h; ty++) for (let tx = x - 1; tx <= x + w; tx++) {
        if (!M.isFloor(tx, ty)) continue;
        const a = M.AREAS[M.areaIdx[ty * W + tx]];
        if (a !== r) c.rect(tx * P, ty * P, P, P);
      }
      c.clip('evenodd');
    };
    for (const key of ['tl', 'tr', 'bl', 'br']) {
      const k = r.cut[key];
      if (!k) continue;
      const right = key[1] === 'r', bottom = key[0] === 'b';
      const X = (du) => (right ? x + w - du : x + du) * P;
      const Y = (dv) => (bottom ? y + h - dv : y + dv) * P;
      const poly = (pts) => {
        c.beginPath();
        pts.forEach(([du, dv], i) => (i ? c.lineTo(X(du), Y(dv)) : c.moveTo(X(du), Y(dv))));
        c.closePath();
      };
      /* faixa entre as diagonais du+dv = lo e du+dv = hi, limitada ao anel da sala */
      const band = (lo, hi) => poly([[hi + 1, -1], [lo + 1, -1], [-1, lo + 1], [-1, hi + 1]]);
      const a = k + 0.5, b = k - 2.05;
      c.save();
      clipRoom();
      /* 1) meia-lajota de piso do lado de dentro da diagonal */
      c.save();
      poly([[a, 0], [k + 1.05, 0], [0, k + 1.05], [0, a]]);
      c.clip();
      for (let i = 0; i < k; i++) {
        const j = k - 1 - i;
        const tx = right ? x + w - 1 - i : x + i, ty = bottom ? y + h - 1 - j : y + j;
        floorTile(c, P, tx, ty, fl[0], fl[1], fl[2]);
      }
      c.restore();
      /* 2) parede diagonal */
      band(b, a);
      c.fillStyle = WALL;
      c.fill();
      if (WINDOWS[r.id]) {
        band(b + 0.45, a - (bottom ? 0.45 : 1.0));
        c.fillStyle = '#060a14';
        c.fill();
        c.save();
        c.clip();
        for (let i = 0; i < k * 3; i++) {
          const t = Math.random() * (k + 2) - 1, off = b + 0.5 + Math.random() * 1.2;
          c.fillStyle = `rgba(255,255,255,${0.35 + Math.random() * 0.6})`;
          c.fillRect(X(t) - 1, Y(off - t) - 1, 2, 2);
        }
        c.restore();
        band(b + 0.45, a - (bottom ? 0.45 : 1.0));
        c.strokeStyle = '#2d3850';
        c.lineWidth = 2;
        c.stroke();
      }
      /* 3) face da parede (cantos de cima) ou contorno (cantos de baixo) */
      if (!bottom) {
        band(a - 0.8, a);
        c.fillStyle = FACE;
        c.fill();
        band(a - 0.8, a - 0.7);
        c.fillStyle = FACE_HI;
        c.fill();
        band(a - 0.14, a);
        c.fillStyle = 'rgba(0,0,0,0.28)';
        c.fill();
      } else {
        c.strokeStyle = '#0a0d15';
        c.lineWidth = 3;
        c.beginPath();
        c.moveTo(X(a + 1), Y(-1));
        c.lineTo(X(-1), Y(a + 1));
        c.stroke();
      }
      c.restore();
    }
  }

  function floorTile(c, P, x, y, base, alt, kind) {
    const px = x * P, py = y * P;
    c.fillStyle = base;
    c.fillRect(px, py, P, P);
    if (kind === 'tiles') {
      if ((x + y) % 2) {
        c.fillStyle = alt;
        c.fillRect(px, py, P, P);
      }
      c.strokeStyle = 'rgba(255,255,255,0.05)';
      c.lineWidth = 1;
      c.strokeRect(px + 0.5, py + 0.5, P - 1, P - 1);
    } else if (kind === 'tiles2') {
      if ((Math.floor(x / 2) + Math.floor(y / 2)) % 2) {
        c.fillStyle = alt;
        c.fillRect(px, py, P, P);
      }
      c.fillStyle = 'rgba(255,255,255,0.05)';
      if (x % 2 === 0) c.fillRect(px, py, 1, P);
      if (y % 2 === 0) c.fillRect(px, py, P, 1);
    } else if (kind === 'plates') {
      c.fillStyle = 'rgba(0,0,0,0.22)';
      if (x % 3 === 0) c.fillRect(px, py, 1.5, P);
      if (y % 3 === 0) c.fillRect(px, py, P, 1.5);
      if (x % 3 === 0 && y % 3 === 0) {
        c.fillStyle = 'rgba(255,255,255,0.14)';
        c.fillRect(px + P * 0.15, py + P * 0.15, P * 0.1, P * 0.1);
      }
    } else if (kind === 'grate') {
      c.strokeStyle = 'rgba(0,0,0,0.3)';
      c.lineWidth = 1;
      for (let i = 0; i < 3; i++) {
        c.beginPath();
        c.moveTo(px, py + (i + 0.5) * (P / 3));
        c.lineTo(px + P, py + (i + 0.5) * (P / 3));
        c.stroke();
      }
      if (x % 2 === 0) {
        c.fillStyle = 'rgba(0,0,0,0.25)';
        c.fillRect(px, py, 1.5, P);
      }
    } else if (kind === 'planks') {
      c.fillStyle = 'rgba(0,0,0,0.2)';
      c.fillRect(px, py + P * 0.49, P, 1.5);
      c.fillRect(px, py, P, 1);
      if ((x + (y % 2) * 2) % 4 === 0) c.fillRect(px, py, 1.5, P * 0.5);
      if ((x + 1 + (y % 2) * 2) % 4 === 0) c.fillRect(px, py + P * 0.5, 1.5, P * 0.5);
    } else if (kind === 'carpet') {
      c.fillStyle = 'rgba(255,255,255,0.025)';
      if ((x + y) % 2) c.fillRect(px, py, P, P);
    } else if (kind === 'hexes') {
      if ((x + y) % 3 === 0) {
        c.strokeStyle = 'rgba(140,160,255,0.08)';
        c.lineWidth = 1;
        c.beginPath();
        for (let k = 0; k < 6; k++) {
          const a = (k / 6) * Math.PI * 2;
          const hx = px + P / 2 + Math.cos(a) * P * 0.42, hy = py + P / 2 + Math.sin(a) * P * 0.42;
          if (k) c.lineTo(hx, hy);
          else c.moveTo(hx, hy);
        }
        c.closePath();
        c.stroke();
      }
    }
  }

  /* Primitivas de desenho em coordenadas de tile. */
  function mkDraw(c, P) {
    const D = {};
    D.rr = (x, y, w, h, r) => {
      c.beginPath();
      if (c.roundRect) c.roundRect(x * P, y * P, w * P, h * P, (r || 0.15) * P);
      else c.rect(x * P, y * P, w * P, h * P);
    };
    D.box = (x, y, w, h, fill, stroke, r) => {
      D.rr(x, y, w, h, r);
      c.fillStyle = fill;
      c.fill();
      if (stroke) {
        c.strokeStyle = stroke;
        c.lineWidth = 2;
        c.stroke();
      }
    };
    D.circle = (x, y, r, fill, stroke, lw) => {
      c.beginPath();
      c.arc(x * P, y * P, r * P, 0, Math.PI * 2);
      if (fill) {
        c.fillStyle = fill;
        c.fill();
      }
      if (stroke) {
        c.strokeStyle = stroke;
        c.lineWidth = lw || 2;
        c.stroke();
      }
    };
    D.shadow = (x, y, rx, ry) => {
      c.fillStyle = 'rgba(0,0,0,0.25)';
      c.beginPath();
      c.ellipse(x * P, y * P, rx * P, ry * P, 0, 0, Math.PI * 2);
      c.fill();
    };
    D.line = (x1, y1, x2, y2, color, lw) => {
      c.strokeStyle = color;
      c.lineWidth = (lw || 0.1) * P;
      c.lineCap = 'round';
      c.beginPath();
      c.moveTo(x1 * P, y1 * P);
      c.lineTo(x2 * P, y2 * P);
      c.stroke();
    };
    D.glow = (x, y, r, color) => {
      const g = c.createRadialGradient(x * P, y * P, 0, x * P, y * P, r * P);
      g.addColorStop(0, color);
      g.addColorStop(1, 'rgba(0,0,0,0)');
      c.fillStyle = g;
      c.fillRect((x - r) * P, (y - r) * P, 2 * r * P, 2 * r * P);
    };
    D.screen = (x, y, w, h, color) => {
      D.box(x, y, w, h, '#0c1420', null, 0.06);
      D.box(x + 0.06, y + 0.06, w - 0.12, h - 0.12, color, null, 0.05);
      c.fillStyle = 'rgba(255,255,255,0.18)';
      c.fillRect((x + 0.1) * P, (y + 0.1) * P, (w - 0.2) * P, 0.06 * P);
    };
    D.stars = (x, y, w, h, n) => {
      for (let i = 0; i < n; i++) {
        c.fillStyle = `rgba(255,255,255,${0.4 + Math.random() * 0.6})`;
        const s = Math.random() < 0.15 ? 2.5 : 1.5;
        c.fillRect((x + Math.random() * w) * P, (y + Math.random() * h) * P, s, s);
      }
    };
    D.crate = (x, y, w, h) => {
      D.shadow(x + w / 2 + 0.1, y + h + 0.05, w * 0.55, 0.18);
      D.box(x, y, w, h, '#86704a', '#3d311f', 0.1);
      c.strokeStyle = 'rgba(0,0,0,0.3)';
      c.lineWidth = 2;
      c.beginPath();
      c.moveTo((x + 0.15) * P, (y + 0.15) * P);
      c.lineTo((x + w - 0.15) * P, (y + h - 0.15) * P);
      c.moveTo((x + w - 0.15) * P, (y + 0.15) * P);
      c.lineTo((x + 0.15) * P, (y + h - 0.15) * P);
      c.stroke();
      c.strokeStyle = 'rgba(255,255,255,0.12)';
      c.strokeRect((x + 0.12) * P, (y + 0.12) * P, (w - 0.24) * P, (h - 0.24) * P);
    };
    D.table = (x, y, r) => {
      D.shadow(x + 0.15, y + 0.25, r * 1.02, r * 0.9);
      for (let i = 0; i < 6; i++) {
        const a = (i / 6) * Math.PI * 2 + 0.3;
        D.circle(x + Math.cos(a) * (r + 0.7), y + Math.sin(a) * (r + 0.7), 0.38, '#6b7488', '#2a3040');
      }
      D.circle(x, y, r, '#a3acc0', '#2a3040', 3);
      D.circle(x - r * 0.25, y - r * 0.25, r * 0.55, 'rgba(255,255,255,0.12)');
    };
    return D;
  }

  function drawRooms(D, c, P) {
    const S = M.STATIONS, B = M.SAB_STATIONS;
    /* placa pintada na face de uma parede de cima */
    const wallSign = (x, y, draw) => {
      D.box(x - 0.45, y + 0.28, 0.9, 0.56, '#dfe6f2', '#141925', 0.08);
      draw(x, y + 0.56);
    };

    /* Cafeteria: mesas redondas, botão de emergência, máquinas de lanche */
    [[63, 9], [75.5, 9], [63, 19.5], [75.5, 19.5]].forEach(([x, y]) => D.table(x, y, 1.45));
    const E = M.EMERGENCY;
    D.shadow(E.x + 0.2, E.y + 0.35, 2.1, 1.8);
    D.circle(E.x, E.y, 2, '#a3acc0', '#2a3040', 3);
    D.circle(E.x, E.y, 1.05, '#6f7d96', '#2a3040');
    D.glow(E.x, E.y, 1.3, 'rgba(255,60,60,0.35)');
    D.circle(E.x, E.y, 0.78, '#c3202b', '#3a0a0e', 3);
    D.circle(E.x - 0.22, E.y - 0.26, 0.28, 'rgba(255,255,255,0.4)');
    [[61.4, '#3d6fb3'], [63.8, '#b33d3d'], [66.2, '#3db36f']].forEach(([x, col]) => {
      D.box(x, 1.75, 2.1, 1.65, col, '#141925', 0.15);
      D.screen(x + 0.3, 1.95, 1.5, 0.5, 'rgba(255,255,255,0.35)');
      D.box(x + 0.35, 2.75, 1.4, 0.4, 'rgba(0,0,0,0.35)', null, 0.08);
    });
    D.box(S.garbageCaf.x - 0.6, S.garbageCaf.y + 0.3, 1.2, 1, '#4b5467', '#141925', 0.2);
    D.line(S.garbageCaf.x - 0.4, S.garbageCaf.y + 0.55, S.garbageCaf.x + 0.4, S.garbageCaf.y + 0.55, '#11141b', 0.08);

    /* MedBay: macas na parede esquerda, scanner no chão, analisador de amostras */
    [21.4, 24.4, 27.4].forEach((y) => {
      const x = 38.45;
      D.shadow(x + 1.9, y + 2.35, 1.9, 0.25);
      D.box(x, y, 3.6, 2.2, '#dfe7f5', '#57627a', 0.35);
      D.box(x + 0.2, y + 0.3, 0.9, 1.6, '#a9bde0', null, 0.3);
      D.box(x + 1.4, y + 0.15, 2.05, 1.9, 'rgba(90,140,200,0.35)', null, 0.2);
    });
    D.glow(S.scan.x, S.scan.y, 1.8, 'rgba(90,240,160,0.25)');
    D.circle(S.scan.x, S.scan.y, 1.15, '#1f3b37', '#3ae08a', 3);
    D.circle(S.scan.x, S.scan.y, 0.75, 'rgba(58,224,138,0.25)', '#3ae08a', 1.5);
    D.box(51.0, 21.2, 0.95, 2.7, '#3b4760', '#141925', 0.15);
    for (let i = 0; i < 4; i++) D.box(51.12, 21.45 + i * 0.6, 0.7, 0.32, ['#e24b4b', '#4aa3ff', '#4be38b', '#ffd23b'][i], null, 0.08);
    wallSign(49.5, 19, (x, y) => {
      D.line(x, y - 0.18, x, y + 0.18, '#e24b4b', 0.12);
      D.line(x - 0.18, y, x + 0.18, y, '#e24b4b', 0.12);
    });

    /* Motores: turbinas com escape brilhando à esquerda */
    [[9, 16], [56.5, 63.5]].forEach(([y, pipeTo], n) => {
      const x = 13, w = 8.5, h = 7;
      D.shadow(x + w / 2, y + h + 0.3, w * 0.55, 0.5);
      for (const px of [15.2, 19.2]) D.line(px, n ? y + h : y, px, n ? 66 : 6, '#4a5263', 0.4);
      D.box(x, y, w, h, '#667086', '#232838', 1.4);
      D.box(x + 0.5, y + 0.5, w - 1, 2, '#7b869c', null, 0.9);
      for (let i = 0; i < 4; i++) D.line(x + 1.5 + i * 1.85, y + 3, x + 1.5 + i * 1.85, y + h - 0.6, 'rgba(0,0,0,0.25)', 0.12);
      D.glow(x - 0.3, y + h / 2, 2.4, 'rgba(255,150,60,0.5)');
      D.box(x - 1.4, y + 1.7, 1.6, h - 3.4, '#4a5263', '#232838', 0.5);
      D.box(x - 1.75, y + 2.1, 0.55, h - 4.2, '#ffb347', null, 0.25);
      void pipeTo;
    });

    /* Reator: núcleo azul com tubos até os scanners de mão */
    D.glow(7.5, 36, 5.5, 'rgba(80,160,255,0.35)');
    for (const st of [B.reactorA, B.reactorB]) D.line(7.5, 36, st.x - 1.0, st.y, '#3b4a66', 0.45);
    D.line(7.5, 36, S.manifolds.x, S.manifolds.y + 0.6, '#3b4a66', 0.35);
    D.line(7.5, 36, S.reactor.x, S.reactor.y - 0.6, '#3b4a66', 0.35);
    D.circle(7.5, 36, 3.1, '#1b2c4a', '#0e1a2e', 4);
    D.circle(7.5, 36, 2.3, '#2468bd', '#123a6b', 3);
    D.circle(7.5, 36, 1.4, '#58b4ff', '#8fd3ff', 2);
    D.circle(7.5, 36, 0.6, '#e6f6ff');
    for (const st of [B.reactorA, B.reactorB]) {
      D.box(st.x - 1.45, st.y - 0.7, 0.9, 1.4, '#28324a', '#0b0d12', 0.2);

    for (const id of Object.keys(M.STATIONS)) if (!skip.has(id)) place(M.STATIONS[id], color(id));
    for (const id of Object.keys(M.SAB_STATIONS)) {
      if (id === 'lights' || id.startsWith('reactor')) continue;
      place(M.SAB_STATIONS[id], 'rgba(255,120,80,0.8)', true);

/* Renderização: mapa pré-desenhado, tripulantes, corpos, efeitos, névoa de visão e ícones SVG. */
(function () {

  function rr(ctx, x, y, w, h, r) {
    if (ctx.roundRect) {
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, r);
      return;
    }
    const rad = Array.isArray(r) ? r : [r, r, r, r];
    ctx.beginPath();
    ctx.moveTo(x + rad[0], y);
    ctx.lineTo(x + w - rad[1], y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + rad[1]);
    ctx.lineTo(x + w, y + h - rad[2]);
    ctx.quadraticCurveTo(x + w, y + h, x + w - rad[2], y + h);
    ctx.lineTo(x + rad[3], y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - rad[3]);
    ctx.lineTo(x, y + rad[0]);
    ctx.quadraticCurveTo(x, y, x + rad[0], y);

  /* ---------- tripulante no canvas ---------- */
  function drawHat(ctx, hat, u) {
    ctx.lineWidth = u * 0.05;

        ctx.ellipse(0, top + 0.02 * u, 0.46 * u, 0.09 * u, 0, 0, Math.PI * 2);

        ctx.stroke();
        rr(ctx, -0.22 * u, top - 0.24 * u, 0.44 * u, 0.26 * u, 0.08 * u);

        ctx.stroke();
        break;
      case 'coroa':
        ctx.fillStyle = '#f2c94c';
        ctx.beginPath();
        ctx.moveTo(-0.24 * u, top + 0.04 * u);
        ctx.lineTo(-0.26 * u, top - 0.2 * u);
        ctx.lineTo(-0.12 * u, top - 0.08 * u);
        ctx.lineTo(0, top - 0.24 * u);
        ctx.lineTo(0.12 * u, top - 0.08 * u);
        ctx.lineTo(0.26 * u, top - 0.2 * u);
        ctx.lineTo(0.24 * u, top + 0.04 * u);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        break;
      case 'cogumelo':
        ctx.fillStyle = '#d63a3a';
        ctx.beginPath();
        ctx.ellipse(0, top - 0.02 * u, 0.36 * u, 0.2 * u, 0, Math.PI, 0);

        ctx.lineTo(0.18 * u, top + 0.03 * u);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#ffd84d';
        ctx.beginPath();
        ctx.arc(0.02 * u, top - 0.42 * u, 0.06 * u, 0, Math.PI * 2);
        ctx.fill();
        break;
      case 'obra':
        ctx.fillStyle = '#f5c518';
        ctx.beginPath();
        ctx.ellipse(0, top + 0.04 * u, 0.36 * u, 0.24 * u, 0, Math.PI, 0);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.fillRect(-0.42 * u, top + 0.02 * u, 0.84 * u, 0.06 * u);
        break;
      case 'bone':
        ctx.fillStyle = '#2d6cdf';
        ctx.beginPath();
        ctx.ellipse(0, top + 0.02 * u, 0.3 * u, 0.18 * u, 0, Math.PI, 0);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.beginPath();
        ctx.ellipse(0.28 * u, top + 0.02 * u, 0.2 * u, 0.05 * u, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

      case 'flor':
        ctx.fillStyle = '#ff8fd1';
        for (let i = 0; i < 5; i++) {
          const a = (i / 5) * Math.PI * 2;
          ctx.beginPath();
          ctx.arc(Math.cos(a) * 0.1 * u, top - 0.1 * u + Math.sin(a) * 0.1 * u, 0.07 * u, 0, Math.PI * 2);

        }
        ctx.fillStyle = '#ffd84d';
        ctx.beginPath();
        ctx.arc(0, top - 0.1 * u, 0.05 * u, 0, Math.PI * 2);

        break;

        ctx.beginPath();
        ctx.moveTo(0, top + 0.02 * u);

        ctx.fill();
        ctx.stroke();
        break;
      default:

    }
  }
