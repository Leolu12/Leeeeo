        ctx.moveTo(-0.34 * u, 0.2 * u);
        ctx.lineTo(-0.34 * u, -0.2 * u);
        ctx.arc(0, -0.2 * u, 0.34 * u, Math.PI, 0);
        ctx.lineTo(0.34 * u, 0.2 * u);
        for (let i = 0; i < 4; i++) ctx.quadraticCurveTo(0.34 * u - (i + 0.5) * 0.17 * u, 0.32 * u, 0.34 * u - (i + 1) * 0.17 * u, 0.2 * u);
        ctx.closePath();
      } else rr(ctx, -0.34 * u, -0.55 * u, 0.68 * u, 0.86 * u, [0.34 * u, 0.34 * u, 0.1 * u, 0.1 * u]);
    };
    ctx.fillStyle = col.hex;
    bodyPath();
    ctx.fill();
    ctx.save();
    ctx.clip();
    ctx.fillStyle = col.shade;
    ctx.beginPath();
    ctx.ellipse(-0.3 * u, 0.2 * u, 0.36 * u, 0.5 * u, 0.3, 0, Math.PI * 2);
    ctx.globalAlpha *= 0.55;
    ctx.fill();
    ctx.restore();
    bodyPath();
    ctx.stroke();
    ctx.fillStyle = visor;
    ctx.beginPath();
    ctx.ellipse(0.1 * u, -0.26 * u, 0.25 * u, 0.15 * u, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath();
    ctx.ellipse(0.16 * u, -0.31 * u, 0.09 * u, 0.04 * u, 0, 0, Math.PI * 2);
    ctx.fill();
    if (o.hat && o.hat !== 'nenhum') drawHat(ctx, o.hat, u);
    ctx.restore();
  }

  function drawPet(ctx, x, y, u, pet, colorId, facing) {
    if (!pet || pet === 'nenhum') return;
    ctx.save();
    ctx.translate(x, y);
    if (facing < 0) ctx.scale(-1, 1);
    ctx.lineWidth = u * 0.05;
    ctx.strokeStyle = '#0b0d12';
    if (pet === 'mini') {
      ctx.restore();
      drawBean(ctx, x, y + 0.08 * u, u * 0.42, colorId, { facing });
      return;
    }
    if (pet === 'robo') {
      ctx.fillStyle = '#9aa6b8';
      rr(ctx, -0.14 * u, -0.1 * u, 0.28 * u, 0.24 * u, 0.05 * u);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#6ff';
      ctx.fillRect(-0.02 * u, -0.04 * u, 0.12 * u, 0.05 * u);
      ctx.beginPath();
      ctx.moveTo(0, -0.1 * u);
      ctx.lineTo(0, -0.2 * u);
      ctx.stroke();
    } else if (pet === 'slime') {
      ctx.fillStyle = '#7ee06b';
      ctx.beginPath();
      ctx.ellipse(0, 0.06 * u, 0.16 * u, 0.12 * u, 0, Math.PI, 0);
      ctx.lineTo(0.16 * u, 0.12 * u);
      ctx.lineTo(-0.16 * u, 0.12 * u);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#0b0d12';
      ctx.fillRect(0.02 * u, 0, 0.03 * u, 0.04 * u);
      ctx.fillRect(0.08 * u, 0, 0.03 * u, 0.04 * u);
    }
    ctx.restore();
  }

  /* ---------- ícone SVG (lobby, reunião, relatório) ---------- */
  function beanSVG(colorId, o) {
    o = o || {};
    const col = C.COLOR[colorId] || C.COLORS[0];
    const visor = (C.VISORS.find((v) => v.id === o.visor) || C.VISORS[0]).hex;
    const s = o.size || 40;
    if (o.dead) {
      return `<svg class="bean" width="${s}" height="${s}" viewBox="-60 -60 120 120" aria-hidden="true"><rect x="-34" y="0" width="68" height="30" rx="10" fill="${col.hex}" stroke="#0b0d12" stroke-width="6"/><rect x="-46" y="4" width="16" height="22" rx="5" fill="${col.shade}" stroke="#0b0d12" stroke-width="6"/><rect x="-5" y="-24" width="10" height="26" rx="4" fill="#f4f0e6" stroke="#0b0d12" stroke-width="5"/><circle cx="-5" cy="-26" r="6" fill="#f4f0e6"/><circle cx="5" cy="-26" r="6" fill="#f4f0e6"/></svg>`;
    }
    const op = o.ghost ? 0.5 : 1;
    return `<svg class="bean" width="${s}" height="${s}" viewBox="-60 -62 120 120" aria-hidden="true" style="opacity:${op}"><rect x="-50" y="-30" width="20" height="44" rx="7" fill="${col.shade}" stroke="#0b0d12" stroke-width="7"/><rect x="-32" y="12" width="24" height="30" rx="8" fill="${col.hex}" stroke="#0b0d12" stroke-width="7"/><rect x="6" y="12" width="24" height="30" rx="8" fill="${col.hex}" stroke="#0b0d12" stroke-width="7"/><path d="M-34 -21 A34 34 0 0 1 34 -21 L34 21 Q34 31 24 31 L-24 31 Q-34 31 -34 21 Z" fill="${col.hex}" stroke="#0b0d12" stroke-width="7"/><ellipse cx="10" cy="-26" rx="25" ry="15" fill="${visor}" stroke="#0b0d12" stroke-width="7"/><ellipse cx="16" cy="-31" rx="9" ry="4" fill="rgba(255,255,255,.75)"/>${o.x ? '<path d="M-26 -40 L26 30 M26 -40 L-26 30" stroke="#ff3b3b" stroke-width="9" stroke-linecap="round"/>' : ''}</svg>`;
  }

  /* ---------- mapa estático (desenhado em decor.js) ---------- */
  let staticCanvas = null;
  function prerender() {
    staticCanvas = AU.Decor.build(PX);
    return staticCanvas;
  }

  /* ---------- fundo estrelado ---------- */
  const stars = [];
  for (let i = 0; i < 260; i++) stars.push({ x: Math.random(), y: Math.random(), z: Math.random() * 0.8 + 0.2 });

  /* ---------- renderização principal ---------- */
  const R = {
    PX, drawBean, beanSVG, drawPet, rr,
    canvas: null,
    ctx: null,
    fog: null,
    fogCtx: null,
    ppt: 32,
    cam: { x: 69, y: 14 },
    setup(canvas) {
      this.canvas = canvas;
      this.ctx = canvas.getContext('2d');
      this.fog = document.createElement('canvas');
      this.fogCtx = this.fog.getContext('2d');
      if (!staticCanvas) prerender();
      this.resize();
    },
    resize() {
      const c = this.canvas;
      if (!c) return;
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      const w = c.clientWidth || window.innerWidth, h = c.clientHeight || window.innerHeight;
      c.width = Math.round(w * dpr);
      c.height = Math.round(h * dpr);
      this.fog.width = c.width;
      this.fog.height = c.height;
      this.dpr = dpr;
      this.ppt = Math.max(16, Math.min(c.height / 19, c.width / 17));
    },
    toScreen(x, y) {
      const c = this.canvas;
      return { x: (x - this.cam.x) * this.ppt + c.width / 2, y: (y - this.cam.y) * this.ppt + c.height / 2 };
    },
    visibleToHuman(g, x, y) {
      const h = g.human;
      if (!h) return true;
      if (!h.alive) return true;
      const r = g.visionOf(h);
      return U.d2(h.x, h.y, x, y) <= r + 0.3 && Nav.los(h.x, h.y, x, y);
    },
    draw(g, t) {
      const ctx = this.ctx, cv = this.canvas;
      if (!ctx) return;
      const h = g.human;
      if (h) {
        this.cam.x += (h.x - this.cam.x) * 0.25;
        this.cam.y += (h.y - this.cam.y) * 0.25;
      }
      const ppt = this.ppt;
      ctx.fillStyle = '#05070f';
      ctx.fillRect(0, 0, cv.width, cv.height);
      for (const s of stars) {
        const sx = ((s.x * cv.width - this.cam.x * ppt * 0.05 * s.z) % cv.width + cv.width) % cv.width;
        const sy = ((s.y * cv.height - this.cam.y * ppt * 0.05 * s.z) % cv.height + cv.height) % cv.height;
        ctx.fillStyle = `rgba(220,230,255,${0.25 + s.z * 0.5})`;
        ctx.fillRect(sx, sy, s.z * 2, s.z * 2);
      }
      const vw = cv.width / ppt, vh = cv.height / ppt;
      const x0 = this.cam.x - vw / 2, y0 = this.cam.y - vh / 2;
      ctx.imageSmoothingEnabled = true;
      ctx.drawImage(staticCanvas, x0 * PX, y0 * PX, vw * PX, vh * PX, 0, 0, cv.width, cv.height);
      const S = (x, y) => ({ x: (x - x0) * ppt, y: (y - y0) * ppt });

      /* estações de tarefa do jogador */
      if (h && !h.isImp && g.phase === 'play') {
        const pulse = 0.55 + Math.sin(t * 5) * 0.35;
        for (const tk of h.tasks) {
          if (tk.done) continue;
          const st = M.STATIONS[tk.steps[tk.step]];
          const p = S(st.x, st.y);
          ctx.strokeStyle = g.taskAvailable(tk) ? `rgba(255,214,64,${pulse})` : 'rgba(255,214,64,0.25)';
          ctx.lineWidth = Math.max(2, ppt * 0.1);
          rr(ctx, p.x - ppt * 0.6, p.y - ppt * 0.6, ppt * 1.2, ppt * 1.2, ppt * 0.2);
          ctx.stroke();
        }
      }
      if (g.sab) {
        const pulse = 0.5 + Math.sin(t * 7) * 0.4;
        for (const st of g.sabStationsNeeded()) {
          const pos = M.SAB_STATIONS[st];
          const p = S(pos.x, pos.y);
          ctx.strokeStyle = `rgba(255,70,70,${pulse})`;
          ctx.lineWidth = Math.max(2, ppt * 0.12);
          rr(ctx, p.x - ppt * 0.7, p.y - ppt * 0.7, ppt * 1.4, ppt * 1.4, ppt * 0.2);
          ctx.stroke();
        }
      }
      /* portas */
      for (const d of M.DOORS) {
        if (!d.closed) continue;
        const [x, y, w, hh] = d.rect;
        const p = S(x, y);
        ctx.fillStyle = '#7d8699';
        ctx.fillRect(p.x, p.y, w * ppt, hh * ppt);
        ctx.fillStyle = '#b3202a';
        if (w > hh) ctx.fillRect(p.x, p.y + hh * ppt * 0.4, w * ppt, hh * ppt * 0.2);
        else ctx.fillRect(p.x + w * ppt * 0.4, p.y, w * ppt * 0.2, hh * ppt);
      }
      /* câmeras: luz vermelha quando alguém assiste */
      if (g.anyoneOnCams()) {
        for (const cam of M.CAMS) {
          const p = S(cam.x, cam.y - 1.6);
          ctx.fillStyle = Math.sin(t * 6) > 0 ? '#ff3b3b' : '#6a1010';
          ctx.beginPath();
          ctx.arc(p.x, p.y, ppt * 0.18, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      this.drawVisualFx(g, t, S, ppt);
      /* corpos */
      for (const b of g.bodies) {
        if (b.gone) continue;
        if (!this.visibleToHuman(g, b.x, b.y)) continue;
        const p = S(b.x, b.y);
        const v = g.players[b.pid];
        drawBean(ctx, p.x, p.y, ppt * 1.1, v.color, { dead: true });
      }
      /* jogadores */
      const list = g.players.slice().sort((a, b) => a.y - b.y);
      const hDead = h && !h.alive;
      for (const p of list) {
        if (p.inVent) continue;
        let alpha = 1;
        if (!p.alive) {
          if (!hDead && p !== h) continue;
          alpha = 0.45;
        } else if (p.invisUntil > g.t) {
          if (p === h || (h && h.isImp && p.isImp)) alpha = 0.3;
          else if (hDead) alpha = 0.3;
          else continue;
        }
        if (p !== h && p.alive && !this.visibleToHuman(g, p.x, p.y)) continue;
        const ap = g.appear(p);
        const sp = S(p.x, p.y);
        const pp = S(p.petX, p.petY);
        if (p.alive) drawPet(ctx, pp.x, pp.y, ppt * 1.1, ap.pet, ap.color, p.facing);
        if (p.visual && p.visual.type === 'scan' && p.alive) {
          ctx.fillStyle = 'rgba(80,255,160,0.25)';
          ctx.beginPath();
          ctx.ellipse(sp.x, sp.y + ppt * 0.35, ppt * 0.8, ppt * 0.3, 0, 0, Math.PI * 2);
          ctx.fill();
        }
        if (p.protectedUntil > g.t && (hDead || (h && h.special === 'anjo'))) {
          ctx.strokeStyle = 'rgba(120,200,255,0.7)';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(sp.x, sp.y - ppt * 0.1, ppt * 0.75, 0, Math.PI * 2);
          ctx.stroke();
        }
        drawBean(ctx, sp.x, sp.y, ppt * 1.1, ap.color, { facing: p.facing, moving: p.moving, walk: p.walkT, ghost: !p.alive, alpha, hat: ap.hat, visor: ap.visor });
        if (p.visual && p.visual.type === 'scan' && p.alive) {
          const yy = sp.y - ppt * 0.6 + ((t * 1.6) % 1) * ppt * 1.1;
          ctx.fillStyle = 'rgba(80,255,160,0.55)';
          ctx.fillRect(sp.x - ppt * 0.45, yy, ppt * 0.9, ppt * 0.08);
        }
        const partner = h && h.isImp && p.isImp;
        ctx.font = `700 ${Math.max(11, ppt * 0.42)}px "Nunito", system-ui, sans-serif`;
        ctx.textAlign = 'center';
        ctx.lineWidth = 3;
        ctx.strokeStyle = 'rgba(0,0,0,0.85)';
        ctx.globalAlpha = alpha;
        ctx.strokeText(ap.name, sp.x, sp.y - ppt * 0.95);
        ctx.fillStyle = partner ? '#ff5a5a' : '#ffffff';
        ctx.fillText(ap.name, sp.x, sp.y - ppt * 0.95);
        ctx.globalAlpha = 1;
      }
      /* efeitos */
      for (const f of g.fx) {
        if (!this.visibleToHuman(g, f.x, f.y) && !(h && (f.type === 'kill' && h.isImp))) continue;
        const k = (g.t - f.t0) / (f.dur || 1);
        const p = S(f.x, f.y);
        ctx.save();
        ctx.globalAlpha = Math.max(0, 1 - k);
        if (f.type === 'kill') {
          ctx.strokeStyle = '#ff2b2b';
          ctx.lineWidth = ppt * 0.12;
          ctx.beginPath();
          ctx.moveTo(p.x - ppt * (0.8 - k * 0.3), p.y - ppt * 0.8);
          ctx.lineTo(p.x + ppt * 0.8, p.y + ppt * (0.6 - k * 0.3));
          ctx.stroke();
        } else if (f.type === 'vent') {
          ctx.fillStyle = 'rgba(160,170,190,0.6)';
          ctx.beginPath();
          ctx.arc(p.x, p.y, ppt * (0.4 + k), 0, Math.PI * 2);
          ctx.fill();
        } else if (f.type === 'puff') {
          ctx.fillStyle = 'rgba(200,120,255,0.6)';
          for (let i = 0; i < 6; i++) {
            const a = (i / 6) * Math.PI * 2;
            ctx.beginPath();
            ctx.arc(p.x + Math.cos(a) * ppt * k, p.y + Math.sin(a) * ppt * k, ppt * 0.3, 0, Math.PI * 2);
            ctx.fill();
          }
        } else if (f.type === 'shield') {
          ctx.strokeStyle = 'rgba(120,200,255,0.9)';
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.arc(p.x, p.y, ppt * (0.7 + k * 0.6), 0, Math.PI * 2);
          ctx.stroke();
        }
        ctx.restore();
      }
      /* névoa de visão */
      if (h && h.alive) this.drawFog(g, h, S, ppt);
      /* sabotagem crítica: vinheta vermelha */
      if (g.sabCritical()) {
        const a = 0.18 + Math.sin(t * 6) * 0.12;
        const grd = ctx.createRadialGradient(cv.width / 2, cv.height / 2, cv.height * 0.3, cv.width / 2, cv.height / 2, cv.height * 0.8);
        grd.addColorStop(0, 'rgba(255,0,0,0)');
        grd.addColorStop(1, `rgba(255,0,0,${a})`);
        ctx.fillStyle = grd;
        ctx.fillRect(0, 0, cv.width, cv.height);
      }
      this.drawArrows(g, t, S, ppt);
    },
    drawVisualFx(g, t, S, ppt) {
      const ctx = this.ctx;
      for (const p of g.players) {
        if (!p.visual || !p.alive) continue;
        if (p.visual.type === 'asteroids') {
          const o = S(99.5, 10.5);
          if (!this.visibleToHuman(g, 99.5, 8)) continue;
          ctx.strokeStyle = 'rgba(120,255,200,0.8)';
          ctx.lineWidth = 2;
          for (let i = 0; i < 2; i++) {
            const a = -Math.PI / 2 + Math.sin(t * 3 + i * 2) * 0.8;
            ctx.beginPath();
            ctx.moveTo(o.x, o.y);
            ctx.lineTo(o.x + Math.cos(a) * ppt * 5, o.y + Math.sin(a) * ppt * 5);
            ctx.stroke();
          }
        } else if (p.visual.type === 'shields') {
          const F = AU.Decor.SHIELD_FX;
          if (!this.visibleToHuman(g, F.x, F.y)) continue;
          const o = S(F.x, F.y);
          ctx.fillStyle = `rgba(90,180,255,${0.25 + Math.sin(t * 8) * 0.1})`;
          ctx.beginPath();
          ctx.arc(o.x, o.y, ppt * 3.4, 0, Math.PI * 2);
          ctx.fill();
        } else if (p.visual.type === 'garbage') {
          if (!this.visibleToHuman(g, 60.5, 64.5)) continue;
          const o = S(60.5, 65.5);
          ctx.fillStyle = 'rgba(160,140,90,0.8)';
          for (let i = 0; i < 6; i++) ctx.fillRect(o.x + Math.sin(t * 5 + i) * ppt, o.y + ((t * 2 + i * 0.3) % 1) * ppt, ppt * 0.2, ppt * 0.2);
        }
      }
    },
    drawFog(g, h, S, ppt) {
      const fc = this.fogCtx, cv = this.canvas;
      const r = g.visionOf(h);
      fc.globalCompositeOperation = 'source-over';
      fc.clearRect(0, 0, cv.width, cv.height);
      fc.fillStyle = 'rgba(3,5,12,0.88)';
      fc.fillRect(0, 0, cv.width, cv.height);
      fc.globalCompositeOperation = 'destination-out';
      const eye = h.inVent ? M.VENT[h.inVent] : h;
      const poly = Nav.visPoly(eye.x, eye.y, r, 240);
      const c0 = S(eye.x, eye.y);
      const grd = fc.createRadialGradient(c0.x, c0.y, r * ppt * 0.6, c0.x, c0.y, r * ppt);
      grd.addColorStop(0, 'rgba(0,0,0,1)');
      grd.addColorStop(1, 'rgba(0,0,0,0)');
      fc.fillStyle = grd;
      fc.beginPath();
      poly.forEach((pt, i) => {
        const s = S(pt.x, pt.y);
        if (i) fc.lineTo(s.x, s.y);
        else fc.moveTo(s.x, s.y);
      });
      fc.closePath();
      fc.fill();
      this.ctx.drawImage(this.fog, 0, 0);
    },
    drawArrows(g, t, S, ppt) {
      const ctx = this.ctx, cv = this.canvas, h = g.human;
      if (!h) return;
      const arrow = (x, y, color) => {
        const p = S(x, y);
        const cx = cv.width / 2, cy = cv.height / 2;
        const dx = p.x - cx, dy = p.y - cy;
        const margin = 40 * (this.dpr || 1);
        if (Math.abs(dx) < cx - margin && Math.abs(dy) < cy - margin) return;
        const k = Math.min((cx - margin) / Math.abs(dx || 1), (cy - margin) / Math.abs(dy || 1));
        const ax = cx + dx * k, ay = cy + dy * k;
        const a = Math.atan2(dy, dx);
        ctx.save();
        ctx.translate(ax, ay);
        ctx.rotate(a);
        ctx.fillStyle = color;
        ctx.globalAlpha = 0.6 + Math.sin(t * 6) * 0.3;
        ctx.beginPath();
        ctx.moveTo(18, 0);
        ctx.lineTo(-10, -12);
        ctx.lineTo(-4, 0);
        ctx.lineTo(-10, 12);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      };
      if (g.sab && h.alive) for (const st of g.sabStationsNeeded()) arrow(M.SAB_STATIONS[st].x, M.SAB_STATIONS[st].y, '#ff4747');
      for (const pg of g.pings) if (h.alive) arrow(pg.x, pg.y, '#ffb347');
      if (h.trackTarget != null && h.trackUntil > g.t) {
        const q = g.players[h.trackTarget];
        if (q.alive) arrow(q.x, q.y, '#6fe3ff');
      }
      if (!h.isImp) {
        for (const tk of h.tasks) {
          if (tk.done || tk.step === 0 || !g.taskAvailable(tk)) continue;
          const st = M.STATIONS[tk.steps[tk.step]];
          arrow(st.x, st.y, '#ffd640');
        }
      }
    },
    /* Vista de câmera sem névoa (painel de segurança). */
    drawCam(canvas, g, cam, t) {
      const ctx = canvas.getContext('2d');
      const ppt = canvas.width / 16;
      const x0 = cam.x - 8, y0 = cam.y - (canvas.height / ppt) / 2;
      ctx.fillStyle = '#05070f';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(staticCanvas, x0 * PX, y0 * PX, 16 * PX, (canvas.height / ppt) * PX, 0, 0, canvas.width, canvas.height);
      const S = (x, y) => ({ x: (x - x0) * ppt, y: (y - y0) * ppt });
      for (const b of g.bodies) {
        if (b.gone || U.d2(b.x, b.y, cam.x, cam.y) > M.CAM_R || !Nav.los(cam.x, cam.y, b.x, b.y)) continue;
        const p = S(b.x, b.y);
        drawBean(ctx, p.x, p.y, ppt * 1.1, g.players[b.pid].color, { dead: true });
      }
      for (const p of g.players) {
        if (!p.alive || p.inVent || p.invisUntil > g.t) continue;
        if (U.d2(p.x, p.y, cam.x, cam.y) > M.CAM_R || !Nav.los(cam.x, cam.y, p.x, p.y)) continue;
        const ap = g.appear(p);
        const s = S(p.x, p.y);
        drawBean(ctx, s.x, s.y, ppt * 1.1, ap.color, { facing: p.facing, moving: p.moving, walk: p.walkT, hat: ap.hat, visor: ap.visor });
      }
      ctx.fillStyle = 'rgba(0,255,120,0.05)';
      for (let y = 0; y < canvas.height; y += 3) ctx.fillRect(0, y, canvas.width, 1);
      ctx.fillStyle = Math.sin(t * 4) > 0 ? '#ff3b3b' : 'transparent';
      ctx.beginPath();
      ctx.arc(12, 12, 5, 0, Math.PI * 2);
      ctx.fill();
    },
    staticMap() {
      if (!staticCanvas) prerender();
      return staticCanvas;
    },
  };

  AU.Render = R;
})();

</script>
  <script>
/* Minitarefas interativas (tarefas e consertos de sabotagem). */
(function () {
  'use strict';
  const AU = window.AU;
  const U = AU.U, M = AU.Map;
  const h = U.h;

  let cur = null;
  let raf = 0;

  const MG = {
    host: null,
    isOpen() { return !!cur; },
    current() { return cur; },
    close(silent) {
      if (!cur) return;
      const c = cur;
      cur = null;
      cancelAnimationFrame(raf);
      try {
        c.cleanup.forEach((f) => f());
      } catch (e) {
        /* ignora */
      }
      c.el.remove();
      if (c.onClose) c.onClose(!!silent);
    },
  };

  function frame(ts) {
    if (!cur) return;
    const dt = Math.min(0.05, (ts - (cur.last || ts)) / 1000);
    cur.last = ts;
    if (cur.tick) {
      try {
        cur.tick(dt);
      } catch (e) {
        if (window.console) console.error(e);
      }
    }
    if (cur) raf = requestAnimationFrame(frame);
  }

  function open(spec) {
    MG.close(true);
    const body = h('div', { class: 'mg-body' });
    const status = h('div', { class: 'mg-status', role: 'status' });
    const closeBtn = h('button', { class: 'mg-close', 'aria-label': 'Fechar tarefa', title: 'Fechar (Esc)' }, '✕');
    const el = h('div', { class: 'mg-wrap' + (spec.cls ? ' ' + spec.cls : '') },
      h('div', { class: 'mg-panel', role: 'dialog', 'aria-label': spec.title },
        h('div', { class: 'mg-head' },
          h('div', {}, h('div', { class: 'mg-title' }, spec.title), spec.sub ? h('div', { class: 'mg-sub' }, spec.sub) : null),
          closeBtn),
        body, status));
    cur = { el, cleanup: [], onClose: spec.onClose, tick: null, finished: false };
    closeBtn.addEventListener('click', () => MG.close());
    el.addEventListener('pointerdown', (e) => {
      if (e.target === el) MG.close();
    });
    (MG.host || document.body).appendChild(el);
    const api = {
      body,
      msg(t, kind) {
        status.textContent = t || '';
        status.className = 'mg-status' + (kind ? ' ' + kind : '');
      },
      done(delay) {
        if (!cur || cur.finished) return;
        cur.finished = true;
        const mine = cur;
        if (spec.onDone) spec.onDone();
        setTimeout(() => {
          if (cur === mine) MG.close(true);
        }, delay == null ? 550 : delay);
      },
      onCleanup(f) { cur.cleanup.push(f); },
      get finished() { return !cur || cur.finished; },
    };
    const res = spec.build(body, api) || {};
    if (cur) {
      cur.tick = res.tick || null;
      if (res.cleanup) cur.cleanup.push(res.cleanup);
      cur.last = 0;
      raf = requestAnimationFrame(frame);
    }
    return api;
  }

  /* Canvas com coordenadas lógicas e captura de ponteiro. */
  function mkCanvas(root, w, hgt) {
    const c = h('canvas', { class: 'mg-canvas', width: w * 2, height: hgt * 2 });
    c.style.aspectRatio = w + ' / ' + hgt;
    root.appendChild(c);
    const ctx = c.getContext('2d');
    ctx.scale(2, 2);
    const pos = (e) => {
      const r = c.getBoundingClientRect();
      return { x: ((e.clientX - r.left) * w) / r.width, y: ((e.clientY - r.top) * hgt) / r.height };
    };
    const on = (down, move, up) => {
      let active = false;
      c.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        active = down(pos(e), e) !== false;
        if (active) {
          try {
            c.setPointerCapture(e.pointerId);
          } catch (er) {
            /* ignora */
          }
        }
      });
      c.addEventListener('pointermove', (e) => {
        if (active && move) move(pos(e), e);
      });
      const end = (e) => {
        if (active && up) up(pos(e), e);
        active = false;
      };
      c.addEventListener('pointerup', end);
      c.addEventListener('pointercancel', end);
    };
    return { c, ctx, pos, on, w, h: hgt };
  }

  const panelBg = (ctx, w, hh) => {
    ctx.fillStyle = '#1b2231';
    ctx.fillRect(0, 0, w, hh);
    ctx.strokeStyle = '#2d3850';
    ctx.lineWidth = 2;
    ctx.strokeRect(1, 1, w - 2, hh - 2);
  };

  /* ================= TAREFAS ================= */
  const B = {};

  B.swipe = (root, api) => {
    const K = mkCanvas(root, 400, 260);
    let stage = 'wallet';
    const card = { x: 70, y: 180 };
    let drag = null;
    let msg = 'INSIRA O CARTÃO', msgC = '#7df9c1';
    K.on(
      (p) => {
        if (api.finished) return false;
        if (stage === 'wallet' && p.x > 40 && p.x < 190 && p.y > 150) {
          stage = 'swipe';
          card.x = 30;
          card.y = 104;
          msg = 'DESLIZE O CARTÃO';
          msgC = '#7df9c1';
          return false;
        }
        if (stage === 'swipe' && p.x > card.x && p.x < card.x + 110 && p.y > card.y - 10 && p.y < card.y + 70) {
          drag = { off: p.x - card.x, t0: performance.now() };
          return true;
        }
        return false;
      },
      (p) => {
        if (drag) card.x = U.clamp(p.x - drag.off, 30, 290);
      },
      () => {
        if (!drag) return;
        const dur = (performance.now() - drag.t0) / 1000;
        if (card.x >= 285) {
          if (dur < 0.55) {
            msg = 'MUITO RÁPIDO. TENTE DE NOVO.';
            msgC = '#ff6b6b';
            AU.Audio.play('fail');
          } else if (dur > 1.35) {
            msg = 'MUITO DEVAGAR. TENTE DE NOVO.';
            msgC = '#ff6b6b';
            AU.Audio.play('fail');
          } else {
            msg = 'ACEITO. OBRIGADO.';
            msgC = '#7df9c1';
            api.done(700);
          }
        } else {
          msg = 'PASSE O CARTÃO ATÉ O FIM.';
          msgC = '#ffd166';
        }
        if (!api.finished) card.x = 30;
        drag = null;
      }
    );
    api.msg('Clique no cartão, depois arraste-o pelo leitor num ritmo constante.');
    return {
      tick() {
        const c = K.ctx;
        panelBg(c, 400, 260);
        c.fillStyle = '#2b3446';
        c.fillRect(20, 16, 360, 64);
        c.fillStyle = '#0c1a14';
        c.fillRect(34, 26, 332, 44);
        c.fillStyle = msgC;
        c.font = '700 15px "Chakra Petch", monospace';
        c.textAlign = 'center';
        c.fillText(msg, 200, 54);
        c.fillStyle = '#0d1018';
        c.fillRect(20, 96, 360, 10);
        if (stage === 'wallet') {
          c.fillStyle = '#6b4a2b';
          c.fillRect(40, 190, 170, 60);
        }
        c.fillStyle = '#e9edf5';
        AU.Render.rr(c, card.x, card.y, 110, 62, 8);
        c.fill();
        c.fillStyle = '#49a7ff';
        c.fillRect(card.x + 8, card.y + 10, 30, 36);
        c.fillStyle = '#222';
        c.fillRect(card.x + 46, card.y + 16, 54, 6);
        c.fillRect(card.x + 46, card.y + 28, 40, 6);
        if (stage === 'wallet') {
          c.fillStyle = '#7c5733';
          c.fillRect(40, 205, 170, 45);
        }
      },
    };
  };

  B.wires = (root, api) => {
    const K = mkCanvas(root, 400, 300);
    const cols = ['#ff3b3b', '#3b7bff', '#ffd23b', '#ff4fd8'];
    const ly = [60, 120, 180, 240];
    const perm = U.shuffle([0, 1, 2, 3]);
    const conn = [null, null, null, null];
    let drag = null;
    K.on(
      (p) => {
        if (p.x > 70) return false;
        const i = ly.findIndex((y) => Math.abs(y - p.y) < 24);
        if (i < 0 || conn[i] != null) return false;
        drag = { i, x: p.x, y: p.y };
        return true;
      },
      (p) => {
        if (drag) {
          drag.x = p.x;
          drag.y = p.y;
        }
      },
      (p) => {
        if (!drag) return;
        if (p.x > 320) {
          const j = ly.findIndex((y) => Math.abs(y - p.y) < 26);
          if (j >= 0 && perm[j] === drag.i && !conn.includes(j)) {
            conn[drag.i] = j;
            AU.Audio.play('click');
            if (conn.every((c) => c != null)) api.done();
          }
        }
        drag = null;
      }
    );
    api.msg('Arraste cada fio até o conector da mesma cor.');
    return {
      tick() {
        const c = K.ctx;
        panelBg(c, 400, 300);
        c.fillStyle = '#2a2f3a';
        c.fillRect(0, 20, 50, 260);
        c.fillRect(350, 20, 50, 260);
        for (let i = 0; i < 4; i++) {
          c.fillStyle = cols[i];
          c.fillRect(0, ly[i] - 10, 46, 20);
          c.fillStyle = cols[perm[i]];
          c.fillRect(354, ly[i] - 10, 46, 20);
          c.fillStyle = conn.includes(i) ? '#ffe36b' : '#555';
          c.fillRect(372, ly[i] - 26, 10, 8);
        }
        c.lineCap = 'round';
        c.lineWidth = 14;
        for (let i = 0; i < 4; i++) {
          if (conn[i] == null) continue;
          c.strokeStyle = cols[i];
          c.beginPath();
          c.moveTo(46, ly[i]);
          c.lineTo(354, ly[conn[i]]);
          c.stroke();
        }
        if (drag) {
          c.strokeStyle = cols[drag.i];
          c.beginPath();
          c.moveTo(46, ly[drag.i]);
          c.lineTo(drag.x, drag.y);
          c.stroke();
        }
      },
    };
  };

  B.calibrate = (root, api) => {
    const K = mkCanvas(root, 400, 270);
    const speeds = [2.1, 3.0, 3.9];
    const ang = [U.rf(0, 6), U.rf(0, 6), U.rf(0, 6)];
    const locked = [false, false, false];
    const colors = ['#ffd23b', '#3bd4ff', '#b06bff'];
    let k = 0, flash = 0;
    const btns = h('div', { class: 'mg-row' });
    const mk = (i) => h('button', {
      class: 'mg-btn', onclick: () => {
        if (i !== k || api.finished) return;
        const a = ((ang[i] % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
        const d = Math.min(a, Math.PI * 2 - a);
        if (d < 0.38) {
          locked[i] = true;
          ang[i] = 0;
          k++;
          AU.Audio.play('click');
          if (k === 3) api.done();
        } else {
          flash = 0.4;
          AU.Audio.play('fail');
        }
      },
    }, 'Calibrar ' + (i + 1));
    const bs = [0, 1, 2].map(mk);
    bs.forEach((b) => btns.appendChild(b));
    root.appendChild(btns);
    api.msg('Aperte "Calibrar" quando o ponteiro passar pela marca no topo.');
    return {
      tick(dt) {
        flash = Math.max(0, flash - dt);
        for (let i = 0; i < 3; i++) if (!locked[i]) ang[i] += speeds[i] * dt;
        bs.forEach((b, i) => (b.disabled = i !== k));
        const c = K.ctx;
        panelBg(c, 400, 270);
        for (let i = 0; i < 3; i++) {
          const cx = 70 + i * 130, cy = 135;
          c.fillStyle = flash > 0 && i === k ? '#5a1a1a' : '#10151f';
          c.beginPath();
          c.arc(cx, cy, 52, 0, Math.PI * 2);
          c.fill();
          c.strokeStyle = colors[i];
          c.lineWidth = 3;
          c.stroke();
          c.fillStyle = '#3ae08a';
          c.beginPath();
          c.moveTo(cx, cy);
          c.arc(cx, cy, 52, -Math.PI / 2 - 0.38, -Math.PI / 2 + 0.38);
          c.closePath();
          c.globalAlpha = 0.35;
          c.fill();
          c.globalAlpha = 1;
          const a = ang[i] - Math.PI / 2;
          c.strokeStyle = locked[i] ? '#3ae08a' : '#fff';
          c.lineWidth = 5;
          c.beginPath();
          c.moveTo(cx, cy);
          c.lineTo(cx + Math.cos(a) * 46, cy + Math.sin(a) * 46);
          c.stroke();
        }
      },
    };
  };

  B.chart = (root, api) => {
    const K = mkCanvas(root, 400, 260);
    const pts = [0, 1, 2, 3, 4].map((i) => ({ x: 40 + i * 80, y: U.rf(50, 210) }));
    const ship = { x: pts[0].x, y: pts[0].y };
    let next = 1, drag = false;
    K.on(
      (p) => {
        if (U.d2(p.x, p.y, ship.x, ship.y) > 30) return false;
        drag = true;
        return true;
      },
      (p) => {
        if (!drag || api.finished) return;
        ship.x = p.x;
        ship.y = p.y;
        const n = pts[next];
        if (U.d2(p.x, p.y, n.x, n.y) < 18) {
          ship.x = n.x;
          ship.y = n.y;
          next++;
          AU.Audio.play('click');
          if (next >= pts.length) {
            drag = false;
            api.done();
          }
        }
      },
      () => {
        drag = false;
        if (!api.finished) {
          ship.x = pts[next - 1].x;
          ship.y = pts[next - 1].y;
        }
      }
    );
    api.msg('Arraste a nave pelos pontos da rota, sem soltar.');
    return {
      tick() {
        const c = K.ctx;
        panelBg(c, 400, 260);
        c.setLineDash([6, 6]);
        c.strokeStyle = '#4c6a9a';
        c.lineWidth = 2;
        c.beginPath();
        pts.forEach((p, i) => (i ? c.lineTo(p.x, p.y) : c.moveTo(p.x, p.y)));
        c.stroke();
        c.setLineDash([]);
        pts.forEach((p, i) => {
          c.fillStyle = i < next ? '#3ae08a' : '#ffd23b';
          c.beginPath();
          c.arc(p.x, p.y, 9, 0, Math.PI * 2);
          c.fill();
        });
        c.fillStyle = '#e9edf5';
        c.beginPath();
        c.moveTo(ship.x + 16, ship.y);
        c.lineTo(ship.x - 10, ship.y - 10);
        c.lineTo(ship.x - 6, ship.y);
        c.lineTo(ship.x - 10, ship.y + 10);
        c.closePath();
        c.fill();
      },
    };
  };

  B.cleanO2 = (root, api) => {
    const K = mkCanvas(root, 400, 280);
    const leaves = [];
    for (let i = 0; i < 7; i++) leaves.push({ x: U.rf(170, 370), y: U.rf(40, 240), a: U.rf(0, 6), vx: U.rf(-6, 6), vy: U.rf(-6, 6) });
    let drag = null;
    K.on(
      (p) => {
        drag = leaves.find((l) => U.d2(l.x, l.y, p.x, p.y) < 24) || null;
        return !!drag;
      },
      (p) => {
        if (drag) {
          drag.x = p.x;
          drag.y = p.y;
        }
      },
      () => {
        if (drag && drag.x < 85) {
          leaves.splice(leaves.indexOf(drag), 1);
          AU.Audio.play('click');
          if (!leaves.length) api.done();
        }
        drag = null;
      }
    );
    api.msg('Arraste todas as folhas até a saída à esquerda.');
    return {
      tick(dt) {
        const c = K.ctx;
        panelBg(c, 400, 280);
        c.fillStyle = '#0b0f16';
        c.fillRect(8, 40, 70, 200);
        c.strokeStyle = '#2d3850';
        for (let y = 50; y < 240; y += 14) {
          c.beginPath();
          c.moveTo(10, y);
          c.lineTo(76, y);
          c.stroke();
        }
        for (const l of leaves) {
          if (l !== drag) {
            l.x = U.clamp(l.x + l.vx * dt, 95, 385);
            l.y = U.clamp(l.y + l.vy * dt, 20, 260);
            l.a += dt;
          }
          c.save();
          c.translate(l.x, l.y);
          c.rotate(l.a);
          c.fillStyle = '#5bbf4a';
          c.beginPath();
          c.ellipse(0, 0, 18, 9, 0, 0, Math.PI * 2);
          c.fill();
          c.strokeStyle = '#2f6e25';
          c.beginPath();
          c.moveTo(-16, 0);
          c.lineTo(16, 0);
          c.stroke();
          c.restore();
        }
      },
    };
  };

  const ACCEPT_LABEL = { acceptUpper: 'MOT. SUP', acceptLower: 'MOT. INF', acceptWeap: 'ARMAS', acceptShields: 'ESCUDOS', acceptNav: 'NAV', acceptO2: 'O2', acceptComms: 'COMMS', acceptSec: 'SEGUR.' };

  B.divert = (root, api, ctx) => {
    const K = mkCanvas(root, 400, 270);
    const target = M.ACCEPT.indexOf(ctx.task.steps[1]);
    let hy = 225, drag = false;
    const tx = 30 + target * 48;
    K.on(
      (p) => {
        if (Math.abs(p.x - tx) > 22 || Math.abs(p.y - hy) > 26) return false;
        drag = true;
        return true;
      },
      (p) => {
        if (!drag || api.finished) return;
        hy = U.clamp(p.y, 45, 225);
        if (hy <= 50) {
          drag = false;
          api.done();
        }
      },
      () => {
        drag = false;
      }
    );
    api.msg('Suba a alavanca destacada para desviar a energia.');
    return {
      tick(dt) {
        if (!drag && hy < 225 && !api.finished) hy = Math.min(225, hy + 200 * dt);
        const c = K.ctx;
        panelBg(c, 400, 270);
        c.font = '700 9px "Chakra Petch", monospace';
        c.textAlign = 'center';
        M.ACCEPT.forEach((id, i) => {
          const x = 30 + i * 48;
          c.fillStyle = i === target ? '#3a3317' : '#10151f';
          c.fillRect(x - 10, 40, 20, 195);
          c.fillStyle = i === target ? '#ffd23b' : '#7d8699';
          c.fillText(ACCEPT_LABEL[id], x, 255);
          const y = i === target ? hy : 225;
          c.fillStyle = i === target ? '#ffd23b' : '#4a5263';
          c.fillRect(x - 16, y - 8, 32, 16);
        });
      },
    };
  };

  B.accept = (root, api) => {

    const lever = h('button', { class: 'mg-lever', 'aria-pressed': 'false' }, h('span', {}));
    lever.addEventListener('click', () => {
      if (on) return;
      on = true;
