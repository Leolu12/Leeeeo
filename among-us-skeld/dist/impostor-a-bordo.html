          const body = await res.text().catch(() => '');
          if (res.status === 429) this.coolUntil = Date.now() + 20000;
          throw new Error('HTTP ' + res.status + ' ' + body.slice(0, 160));
        }
        const j = await res.json();
        const c = j.choices && j.choices[0];
        return (c && c.message && (c.message.content || c.message.reasoning_content)) || '';
      } finally {
        clearTimeout(timer);
      }
    },

    async listModels() {
      const base = this.cfg.base.replace(/\/+$/, '');
      const headers = {};
      if (this.cfg.key) headers.Authorization = 'Bearer ' + this.cfg.key;
      const res = await fetch(base + '/models', { headers });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const j = await res.json();
      const list = (j.data || j.models || []).map((m) => m.id || m.name).filter(Boolean);
      const free = list.filter((id) => /:free$/.test(id));
      return free.length ? free.concat(list.filter((id) => !/:free$/.test(id))) : list;
    },

    async test() {
      const prev = this.status;
      if (this.provider === 'claude' && this.claudeSample && !this.claudeGranted) {
        await this.warmup();
        if (!this.claudeGranted) return null;
      }
      const ok = this.provider === 'api' || this.provider === 'webllm' || this.provider === 'claude';
      if (!ok) {
        this.set(prev, this.detail);
        return null;
      }
      this.set('loading', 'Testando…', 0.5);
      this.status = 'ready';
      this.coolUntil = 0;
      this.failStreak = 0;
      const t0 = performance.now();
      const r = await this.complete('Você é um jogador num chat de jogo.', 'Diga "oi, bora jogar" de um jeito descontraído, em até 8 palavras.', { maxTokens: 40, timeout: 20000 });

      if (r) this.set('ready', 'Funcionando (' + ms + ' ms): "' + r.slice(0, 60) + '"');
      else if (this.status !== 'off') {
        const why = this.lastError ? ' Erro: ' + this.lastError.message : '';
        this.set('error', (this.provider === 'claude' ? 'O Claude não respondeu.' : 'A IA não respondeu. Confira a chave, o endereço e o modelo.') + why);
      }
      return r;
    },
  };

  /* Limpa blocos de raciocínio e marcações comuns. */
  function cleanReply(text) {
    if (!text) return '';
    return String(text)
      .replace(/<think>[\s\S]*?<\/think>/gi, '')
      .replace(/^```[a-z]*\n?|```$/gim, '')
      .trim();
  }

  AU.LLM = LLM;
})();

  <script>
/* Engine de regras: jogadores, abates, dutos, sabotagens, tarefas, reuniões e vitória. */
(function () {
  'use strict';
  const AU = window.AU;

  const BASE_SPEED = 5.2;

  class Player {
    constructor(id, o) {

      this.visor = o.visor || 'classico';
      this.personality = o.personality || null;
      this.role = 'crew';
      this.special = null;
      this.x = 0;
      this.y = 0;
      this.facing = 1;
      this.moving = false;
      this.walkT = 0;
      this.alive = true;
      this.tasks = [];
      this.killCd = 10;
      this.inVent = null;
      this.ventT = 0;
      this.emergencyLeft = 0;
      this.shiftAs = null;
      this.shiftUntil = 0;
      this.abilityCd = 10;
      this.invisUntil = 0;
      this.protectedUntil = 0;
      this.trackTarget = null;
      this.trackUntil = 0;
      this.battery = 10;
      this.visual = null;
      this.busy = null;
      this.deathT = null;
      this.killerId = null;
      this.ejected = false;
      this.brain = null;
      this.onCams = false;
      this.onAdmin = false;
      this.lastKillT = -99;
      this.petX = 0;
      this.petY = 0;
    }
    get isImp() { return this.role === 'impostor'; }
    get colorObj() { return C.COLOR[this.color]; }
  }

  class Game {
    constructor(settings, roster, opts) {

      this.S = settings;
      this.ui = opts.ui || {};
      this.headless = !!opts.headless;
      this.t = 0;
      this.phase = 'play';
      this.players = roster.map((r, i) => new Player(i, r));

      this.sabCd = 12;

      this.doorCd = {};
      this.events = [];
      this.meeting = null;
      this.meetings = 0;
      this.bodyFound = false;
      this.emergencyCdUntil = settings.rules.emergencyCooldown;

      this.fx = [];
      this.lightLevel = 1;

    assignRoles() {

      if (h && this.phase === 'play' && !h.inVent && !h.frozen) {
        const len = Math.hypot(this.input.x, this.input.y);
        if (len > 0.05) {
          const s = this.speedOf(h) * Math.min(1, len);
          this.moveEntity(h, (this.input.x / len) * s, (this.input.y / len) * s, dt);
          if (h.busy && !h.busy.minigame) h.busy = null;
        }
      }
      for (const p of this.players) if (p.brain) p.brain.update(dt);
      if (this.phase !== 'play') return;

      this.percT -= dt;
      if (this.percT <= 0) {
        this.percT = 0.2;
        this.perceive();
      }
      for (const p of this.players) {
        const tx = p.x - p.facing * 0.9, ty = p.y + 0.25;
        p.petX += (tx - p.petX) * Math.min(1, dt * 4);
        p.petY += (ty - p.petY) * Math.min(1, dt * 4);
      }
      this.fx = this.fx.filter((f) => t - f.t0 < (f.dur || 1));
      this.pings = this.pings.filter((pg) => pg.until > t);
      this.checkWin();
    }

    /* ---------- percepção dos bots ---------- */
    perceive() {
      const t = this.t;
      const targets = this.players.filter((q) => q.alive && !q.inVent && !(q.invisUntil > t));
      const bodies = this.bodies.filter((b) => !b.gone);
      const commsDown = this.commsDown();
      for (const b of this.players) {
        if (!b.brain || !b.alive || b.inVent) continue;
        const r = this.visionOf(b);
        const seen = [];
        for (const q of targets) {
          if (q === b) continue;
          if (U.d2(b.x, b.y, q.x, q.y) <= r && Nav.los(b.x, b.y, q.x, q.y)) seen.push(q);
        }
        const bs = bodies.filter((bd) => U.d2(b.x, b.y, bd.x, bd.y) <= r && Nav.los(b.x, b.y, bd.x, bd.y));
        b.brain.perceive(seen, bs, 'eyes');
        if (b.onCams && !commsDown) {
          const cs = [], cb = [];
          for (const cam of M.CAMS) {
            for (const q of targets) {
              if (q === b || cs.includes(q) || seen.includes(q)) continue;
              if (U.d2(cam.x, cam.y, q.x, q.y) <= M.CAM_R && Nav.los(cam.x, cam.y, q.x, q.y)) cs.push(q);
            }
            for (const bd of bodies) {
              if (!cb.includes(bd) && U.d2(cam.x, cam.y, bd.x, bd.y) <= M.CAM_R && Nav.los(cam.x, cam.y, bd.x, bd.y)) cb.push(bd);
            }
          }
          if (cs.length || cb.length) b.brain.perceive(cs, cb, 'cams');
        }
        if (b.trackTarget != null && b.trackUntil > t) {
          const q = this.players[b.trackTarget];
          if (q.alive) b.brain.perceiveTrack(q);
        }
      }
    }

    witnesses(points, exclude) {
      const res = [];
      const commsDown = this.commsDown();
      for (const b of this.players) {
        if (!b.alive || b.inVent || exclude.includes(b.id)) continue;
        const r = this.visionOf(b);
        let via = null;
        if (points.some((pt) => U.d2(b.x, b.y, pt.x, pt.y) <= r && Nav.los(b.x, b.y, pt.x, pt.y))) via = 'eyes';
        else if (b.onCams && !commsDown && points.some((pt) => M.CAMS.some((c) => U.d2(c.x, c.y, pt.x, pt.y) <= M.CAM_R && Nav.los(c.x, c.y, pt.x, pt.y)))) via = 'cams';
        if (via) res.push({ p: b, via });
      }
      return res;
    }

    /* ---------- abate e reporte ---------- */
    killTargetFor(k) {
      if (!k.alive || !k.isImp || k.inVent) return null;
      let best = null, bd = 1e9;
      for (const v of this.players) {
        if (!v.alive || v.isImp || v.inVent || v === k) continue;
        const d = U.dist(k, v);
        if (d <= this.killDist && d < bd && Nav.los(k.x, k.y, v.x, v.y)) {
          bd = d;
          best = v;
        }
      }
      return best;
    }

    partnerKilledRecently(k) {
      return this.players.some((p) => p !== k && p.isImp && this.t - p.lastKillT < 8);
    }

    tryKill(k, v) {
      const t = this.t;
      if (this.phase !== 'play' || !k.alive || !k.isImp || k.killCd > 0 || !v || !v.alive || v.isImp || k.inVent || v.inVent) return false;
      if (k.invisUntil > t) return false;
      if (U.dist(k, v) > this.killDist + 0.05) return false;
      if (this.S.house.noDoubleKill && this.partnerKilledRecently(k)) return false;
      if (v.protectedUntil > t) {
        v.protectedUntil = 0;
        k.killCd = this.S.rules.killCooldown * 0.5;
        this.addFx({ type: 'shield', x: v.x, y: v.y, dur: 1.2 });
        this.log({ type: 'protectBlock', killer: k.id, victim: v.id });
        if (k.isHuman || v.isHuman) this.say('toast', 'Um escudo de anjo bloqueou o abate!');
        this.sfx('shield');
        return false;
      }
      const kx = k.x, ky = k.y;
      const area = M.areaAt(v.x, v.y);
      const apparent = this.appearId(k);
      v.alive = false;
      v.deathT = t;
      v.killerId = k.id;
      v.killerApparent = apparent;
      v.busy = null;
      v.visual = null;
      v.onCams = false;
      v.onAdmin = false;
      v.trackTarget = null;
      const body = { id: this.bodies.length, pid: v.id, x: v.x, y: v.y, t, area: area.id, reported: false, gone: false, killer: k.id };
      this.bodies.push(body);
      k.x = v.x;
      k.y = v.y;
      k.killCd = this.S.rules.killCooldown;
      k.lastKillT = t;
      k.busy = null;
      const wit = this.witnesses([{ x: kx, y: ky }, { x: v.x, y: v.y }], [k.id, v.id]);
      for (const w of wit) if (w.p.brain) w.p.brain.onWitnessKill(apparent, v.id, area.id, w.via, body);
      if (k.brain) k.brain.onKilled(v, body, wit);
      if (v.brain) v.brain.onDeath(k, apparent);
      this.addFx({ type: 'kill', x: v.x, y: v.y, dur: 0.8 });
      this.log({ type: 'kill', killer: k.id, victim: v.id, area: area.id, apparent, witnesses: wit.map((w) => w.p.id) });
      const h = this.human;
      if (v.isHuman) {
        this.sfx('kill');
        this.say('onHumanKilled', k, this.players[apparent]);
      } else if (k.isHuman) {
        this.sfx('kill');
      } else if (h && h.alive && this.canSeePoint(h, v.x, v.y)) {
        this.sfx('kill');
        this.say('narrate', 'Você viu um abate acontecer diante dos seus olhos.', 'event');
      }
      if (v.special === 'barulhento') {
        this.pings.push({ x: v.x, y: v.y, until: t + 10, pid: v.id });
        for (const p of this.players) if (p.brain && p.alive) p.brain.onNoise(body);
        if (h && h.alive) this.say('toast', 'Alerta! Um tripulante morreu — siga o sinal.');
      }
      this.checkWin();
      return true;
    }

    bodyInReach(p) {
      if (!p.alive || p.inVent) return null;
      let best = null, bd = 1e9;
      for (const b of this.bodies) {
        if (b.gone || b.reported) continue;
        const d = U.d2(p.x, p.y, b.x, b.y);
        if (d <= REPORT_DIST && d < bd && Nav.los(p.x, p.y, b.x, b.y)) {
          bd = d;
          best = b;
        }
      }
      if (best && this.S.house.noSelfReport && best.killer === p.id) return null;
      return best;
    }

    tryReport(p, body) {
      if (this.phase !== 'play' || !p.alive || !body || body.reported || body.gone) return false;
      if (U.d2(p.x, p.y, body.x, body.y) > REPORT_DIST + 0.2 || !Nav.los(p.x, p.y, body.x, body.y)) return false;
      if (this.S.house.noSelfReport && body.killer === p.id) return false;
      body.reported = true;
      this.bodyFound = true;
      this.log({ type: 'report', by: p.id, victim: body.pid, area: body.area });
      this.startMeeting({ kind: 'report', caller: p.id, body });
      return true;
    }

    canEmergency(p) {
      return this.phase === 'play' && p.alive && !p.inVent && p.emergencyLeft > 0 && this.t >= this.emergencyCdUntil && !this.sabCritical();
    }
    nearButton(p) { return U.d2(p.x, p.y, M.EMERGENCY.x, M.EMERGENCY.y) <= BUTTON_DIST; }
    tryEmergency(p) {
      if (!this.canEmergency(p) || !this.nearButton(p)) return false;
      p.emergencyLeft--;
      this.log({ type: 'emergency', by: p.id });
      this.startMeeting({ kind: 'emergency', caller: p.id });
      return true;
    }

    /* ---------- reuniões ---------- */
    startMeeting(info) {
      this.phase = 'meeting';
      this.say('closeOverlays');
      if (this.sabCritical()) {
        this.log({ type: 'sabFix', sab: this.sab.type, by: null, meeting: true });
        this.sab = null;
        AU.Audio.alarm(false);
      }
      for (const p of this.players) {
        if (p.inVent) p.inVent = null;
        if (p.shiftAs != null) p.shiftAs = null;
        p.invisUntil = 0;
        p.onCams = false;
        p.onAdmin = false;
        p.busy = null;
        p.visual = null;
        p.moving = false;
      }
      for (const room of M.DOOR_ROOMS) {
        this.doorUntil[room] = 0;
        M.setDoorsClosed(room, false);
      }
      this.meetings++;
      info.index = this.meetings;
      info.t = this.t;
      info.roundStart = this.roundStart;
      this.log({ type: 'meeting', kind: info.kind, by: info.caller, index: this.meetings });
      this.sfx(info.kind === 'report' ? 'report' : 'meeting');
      this.meeting = new AU.Meeting(this, info);
      this.meetingLog = this.meetingLog || [];
      this.meetingLog.push(this.meeting);
      this.say('onMeetingStart', this.meeting);
    }

    finishMeeting(result) {
      const ej = result.ejected != null ? this.players[result.ejected] : null;
      if (ej) {
        ej.alive = false;
        ej.ejected = true;
        ej.deathT = this.t;
        ej.busy = null;
      }
      this.log({ type: 'vote', index: this.meeting ? this.meeting.info.index : this.meetings, ejected: ej ? ej.id : null, tie: !!result.tie, votes: result.votes });
      this.bodies.forEach((b) => (b.gone = true));
      this.placeAtTable();
      for (const p of this.players) {
        if (p.isImp) p.killCd = this.S.rules.killCooldown;
        if (p.special) p.abilityCd = Math.max(p.abilityCd, 10);
      }
      this.sabCd = Math.max(this.sabCd, 12);
      this.emergencyCdUntil = this.t + this.S.rules.emergencyCooldown;
      this.roundStart = this.t;
      for (const p of this.players) if (p.brain) p.brain.onMeetingEnd(result);
      this.meeting = null;
      this.phase = 'play';
      this.checkWin();
    }

    /* ---------- sabotagem ---------- */
    canSabotage(p) {
      return !!p && p.isImp && this.phase === 'play' && !this.sab && this.sabCd <= 0 && !p.inVent;
    }
    critAllowed() { return !this.S.house.critAfterFirstBody || this.bodyFound; }
    sabotage(type, p) {
      if (!this.canSabotage(p)) return false;
      if ((type === 'reactor' || type === 'o2') && !this.critAllowed()) return false;
      const s = { type, t0: this.t, by: p.id };
      if (type === 'lights') {
        s.switches = [0, 1, 2, 3, 4].map(() => U.chance(0.5));
        if (s.switches.every(Boolean)) s.switches[U.rint(0, 4)] = false;
        s.switches[U.rint(0, 4)] = false;
      } else if (type === 'reactor') {
        s.timer = CRIT_TIME;
        s.hold = { A: -9, B: -9 };
        s.both = 0;
      } else if (type === 'o2') {
        s.timer = CRIT_TIME;
        s.code = String(U.rint(10000, 99999));
        s.done = { A: false, B: false };
      } else if (type === 'comms') {
        s.target = U.rf(-2.4, 2.4);
      } else return false;
      this.sab = s;
      this.dispatchT = 0;
      this.log({ type: 'sabotage', sab: type, by: p.id });
      for (const q of this.players) if (q.brain) q.brain.onSabotage(s);
      this.say('onSabotage', s);
      this.sfx('sabotage');
      if (type === 'reactor' || type === 'o2') {
        if (!this.headless) AU.Audio.alarm(true);
      }
      return true;
    }
    sabFixed(by) {
      if (!this.sab) return;
      const s = this.sab;
      this.log({ type: 'sabFix', sab: s.type, by: by ? by.id : null, dur: this.t - s.t0 });
      this.sab = null;
      this.sabCd = 30;
      AU.Audio.alarm(false);
      for (const q of this.players) if (q.brain) q.brain.onSabFixed(s);
      this.say('onSabFixed', s);
    }
    fixLightsToggle(i, p) {
      const s = this.sab;
      if (!s || s.type !== 'lights') return;
      s.switches[i] = !s.switches[i];
      if (s.switches.every(Boolean)) this.sabFixed(p);
    }
    botFixLights(p) {
      if (this.sab && this.sab.type === 'lights') {
        this.sab.switches = this.sab.switches.map(() => true);
        this.sabFixed(p);
      }
    }
    reactorHold(p, which) {
      if (this.sab && this.sab.type === 'reactor') this.sab.hold[which] = this.t;
    }
    o2Enter(which, code, p) {
      const s = this.sab;
      if (!s || s.type !== 'o2') return false;
      if (String(code) !== s.code) return false;
      s.done[which] = true;
      this.log({ type: 'o2pad', which, by: p.id });
      if (s.done.A && s.done.B) this.sabFixed(p);
      return true;
    }
    fixComms(p) {
      if (this.sab && this.sab.type === 'comms') this.sabFixed(p);
    }
    sabStationsNeeded() {
      const s = this.sab;
      if (!s) return [];
      if (s.type === 'lights') return ['lights'];
      if (s.type === 'comms') return ['comms'];
      if (s.type === 'reactor') return ['reactorA', 'reactorB'];
      if (s.type === 'o2') return ['o2A', 'o2B'].filter((k) => !s.done[k.slice(-1)]);
      return [];
    }
    dispatchFix() {
      const s = this.sab;
      if (!s) return;
      const need = this.sabStationsNeeded();
      const want = s.type === 'lights' ? 2 : s.type === 'comms' ? 1 : 2;
      for (const st of need) {
        const pos = M.SAB_STATIONS[st];
        const assigned = this.players.filter((p) => p.alive && p.brain && p.brain.fix === st);
        if (assigned.length >= want) continue;
        const cands = this.players
          .filter((p) => p.alive && p.brain && !p.isImp && !p.brain.fix && !p.inVent)
          .sort((a, b) => U.d2(a.x, a.y, pos.x, pos.y) - U.d2(b.x, b.y, pos.x, pos.y));
        for (const c of cands.slice(0, want - assigned.length)) c.brain.assignFix(st);
      }
    }

    doorReady(room) { return (this.doorCd[room] || 0) <= this.t; }
    closeDoors(room, p) {
      if (!p || !p.isImp || this.phase !== 'play' || !this.doorReady(room) || !M.DOOR_ROOMS.includes(room)) return false;
      this.doorUntil[room] = this.t + 10;
      this.doorCd[room] = this.t + 26;
      M.setDoorsClosed(room, true);
      this.log({ type: 'doors', room, by: p.id });
      for (const q of this.players) if (q.brain) q.brain.onDoors(room);
      const h = this.human;
      if (h && U.d2(h.x, h.y, M.AREA[room].cx, M.AREA[room].cy) < 16) this.sfx('door');
      return true;
    }

    /* ---------- dutos ---------- */
    canVent(p) { return p.alive && (p.isImp || p.special === 'engenheiro') && this.phase === 'play'; }
    nearestVent(p) {
      let best = null, bd = VENT_DIST;
      for (const v of M.VENTS) {
        const d = U.d2(p.x, p.y, v.x, v.y);
        if (d <= bd) {
          bd = d;
          best = v;
        }
      }
      return best;
    }
    enterVent(p, v) {
      if (!this.canVent(p) || p.inVent || !v) return false;
      if (p.special === 'engenheiro' && p.abilityCd > 0) return false;
      if (p.invisUntil > this.t) return false;
      p.inVent = v.id;
      p.x = v.x;
      p.y = v.y;
      p.ventT = this.t;
      p.busy = null;
      p.onCams = false;
      const wit = this.witnesses([v], [p.id]);
      const ap = this.appearId(p);
      for (const w of wit) if (w.p.brain) w.p.brain.onWitnessVent(ap, 'in', v, w.via);
      this.addFx({ type: 'vent', x: v.x, y: v.y, dur: 0.5 });
      this.log({ type: 'vent', by: p.id, vent: v.id, dir: 'in', witnesses: wit.map((w) => w.p.id) });
      if (this.human && (p.isHuman || this.canSeePoint(this.human, v.x, v.y))) this.sfx('vent');
      return true;
    }
    ventTo(p, vid) {
      if (!p.inVent) return false;
      const cur = M.VENT[p.inVent];
      if (!cur.links.includes(vid)) return false;
      const v = M.VENT[vid];
      p.inVent = vid;
      p.x = v.x;
      p.y = v.y;
      if (p.isHuman) this.sfx('vent');
      return true;
    }
    exitVent(p) {
      if (!p.inVent) return false;
      const v = M.VENT[p.inVent];
      p.inVent = null;
      const wit = this.witnesses([v], [p.id]);
      const ap = this.appearId(p);
      for (const w of wit) if (w.p.brain) w.p.brain.onWitnessVent(ap, 'out', v, w.via);
      this.addFx({ type: 'vent', x: v.x, y: v.y, dur: 0.5 });
      this.log({ type: 'vent', by: p.id, vent: v.id, dir: 'out', witnesses: wit.map((w) => w.p.id) });
      if (p.special === 'engenheiro') p.abilityCd = 20;
      if (this.human && (p.isHuman || this.canSeePoint(this.human, v.x, v.y))) this.sfx('vent');
      return true;
    }

    /* ---------- habilidades especiais ---------- */
    shapeshift(p, targetId) {
      const t = this.t;
      if (p.special !== 'metamorfo' || !p.alive || p.abilityCd > 0 || p.inVent || p.shiftAs != null || this.phase !== 'play') return false;
      const tg = this.players[targetId];
      if (!tg || tg === p) return false;
      const wit = this.witnesses([p], [p.id]);
      for (const w of wit) if (w.p.brain) w.p.brain.onWitnessShift(p.id, targetId, w.via);
      p.shiftAs = targetId;
      p.shiftUntil = t + 30;
      this.addFx({ type: 'puff', x: p.x, y: p.y, dur: 0.6 });
      this.log({ type: 'shift', by: p.id, into: targetId, witnesses: wit.map((w) => w.p.id) });
      return true;
    }
    unshift(p) {
      if (p.shiftAs == null) return;
      const wit = this.witnesses([p], [p.id]);
      for (const w of wit) if (w.p.brain) w.p.brain.onWitnessShift(p.id, p.shiftAs, w.via);
      p.shiftAs = null;
      p.abilityCd = 25;
      this.addFx({ type: 'puff', x: p.x, y: p.y, dur: 0.6 });
    }
    vanish(p) {
      if (p.special !== 'fantasma' || !p.alive || p.abilityCd > 0 || p.inVent || p.invisUntil > this.t || this.phase !== 'play') return false;
      const wit = this.witnesses([p], [p.id]);
      for (const w of wit) if (w.p.brain) w.p.brain.onWitnessVanish(p.id, w.via);
      p.invisUntil = this.t + 10;
      this.addFx({ type: 'puff', x: p.x, y: p.y, dur: 0.6 });
      this.log({ type: 'vanish', by: p.id, witnesses: wit.map((w) => w.p.id) });
      return true;
    }
    reappear(p) {
      p.invisUntil = 0;
      p.abilityCd = 25;
      const wit = this.witnesses([p], [p.id]);
      for (const w of wit) if (w.p.brain) w.p.brain.onWitnessVanish(p.id, w.via);
      this.addFx({ type: 'puff', x: p.x, y: p.y, dur: 0.6 });
    }
    track(p, targetId) {
      if (p.special !== 'rastreador' || !p.alive || p.abilityCd > 0) return false;
      const tg = this.players[targetId];
      if (!tg || !tg.alive || tg === p || U.dist(p, tg) > 3.5) return false;
      p.trackTarget = targetId;
      p.trackUntil = this.t + 30;
      p.abilityCd = 45;
      this.log({ type: 'track', by: p.id, target: targetId });
      return true;
    }
    protect(p, targetId) {
      if (p.special !== 'anjo' || p.alive || p.abilityCd > 0 || p.isImp) return false;
      const tg = this.players[targetId];
      if (!tg || !tg.alive || U.dist(p, tg) > 4) return false;
      tg.protectedUntil = this.t + 35;
      p.abilityCd = 60;
      this.log({ type: 'protect', by: p.id, target: targetId });
      return true;
    }

    /* ---------- tarefas ---------- */
    stationOfTask(task) {
      if (task.done) return null;
      return M.STATIONS[task.steps[task.step]];
    }
    taskAvailable(task) {
      if (task.done) return false;
      if (task.id === 'inspect' && task.step === 1 && this.t < task.readyAt) return false;
      return true;
    }
    completeStep(p, task) {
      if (task.done) return;
      if (task.id === 'inspect' && task.step === 0) task.readyAt = this.t + (task.def.wait || 45);
      task.step++;
      if (task.step >= task.steps.length) {
        task.done = true;
        if (!p.isImp) this.log({ type: 'task', by: p.id, task: task.id });
        if (p.special === 'cientista') p.battery = Math.min(10, p.battery + 3);
      }
      if (task.def.visual === 'shields' && task.done) p.visual = { type: 'shields', until: this.t + 2.5 };

    }
    resetInspect(task) {
      task.step = 0;
      task.readyAt = 0;
    }
    taskProgress() {
      let total = 0, done = 0;
      for (const p of this.players) {
        if (p.isImp) continue;
        for (const tk of p.tasks) {
          total++;
          if (tk.done) done++;
        }
      }
      return { total, done, ratio: total ? done / total : 0 };
    }

    useTarget(p) {
      if (this.phase !== 'play' || p.inVent) return null;
      const near = (x, y, d) => U.d2(p.x, p.y, x, y) <= (d || USE_DIST);
      const s = this.sab;
      if (s && p.alive) {
        for (const st of this.sabStationsNeeded()) {
          const pos = M.SAB_STATIONS[st];
          if (near(pos.x, pos.y)) return { kind: 'sab', station: st, label: 'Consertar' };
        }
      } else if (s && !p.alive && !p.isImp) {
        /* fantasmas não consertam sabotagens */
      }
      if (!p.isImp) {
        for (const tk of p.tasks) {
          if (tk.done) continue;
          const st = M.STATIONS[tk.steps[tk.step]];
          if (near(st.x, st.y)) return { kind: 'task', task: tk, station: st, label: 'Tarefa' };
        }
      }
      if (p.alive && near(M.EMERGENCY.x, M.EMERGENCY.y, BUTTON_DIST)) return { kind: 'button', label: 'Emergência' };
      if (p.alive && near(M.SECURITY.x, M.SECURITY.y)) return { kind: 'cams', label: 'Câmeras' };
      if (near(M.ADMIN_TABLE.x, M.ADMIN_TABLE.y, 2.2)) return { kind: 'admin', label: 'Admin' };
      return null;
    }

    /* ---------- vitória ---------- */
    checkWin() {
      if (this.phase === 'ended' || this.phase === 'meeting') return;
      const alive = this.alivePlayers();
      const imp = alive.filter((p) => p.isImp).length;
      const crew = alive.length - imp;
      if (imp === 0) return this.end('crew', 'Todos os impostores foram eliminados.');
      if (imp >= crew) return this.end('impostor', 'Os impostores igualaram o número de tripulantes.');
      const tp = this.taskProgress();
      if (tp.total > 0 && tp.done >= tp.total) return this.end('crew', 'Todas as tarefas foram concluídas.');
    }
    end(winner, reason) {
      if (this.phase === 'ended') return;
      this.phase = 'ended';
      this.winner = winner;
      this.endReason = reason;
      AU.Audio.alarm(false);
      this.log({ type: 'end', winner, reason });
      this.say('closeOverlays');
      this.say('onGameEnd', { winner, reason });
    }
  }

  AU.Game = Game;
  AU.Player = Player;

  <script>
/* Mente dos bots em campo: percepção limitada, memória, rotas, tarefas e estratégia de impostor. */
(function () {

  class Memory {

    event(e, key) {

  class Brain {

      this.susp = {};
      this.carry = {};
      this.plan = null;
      this.path = null;
      this.pi = 0;
      this.dest = null;
      this.thinkT = U.rf(0.2, 1.2);
      this.retryT = 0;
      this.dynT = 0;
      this.stuck = 0;
      this.fix = null;

      this.bodiesNow = [];

      this.ventPlan = null;

      this.trailT = 0;

    /* ---------- ciclo ---------- */
    update(dt) {
      const g = this.g, p = this.p;

    setPlan(pl) {
      const p = this.p;

      this.dest = null;

    routeTo(x, y) {

    moveAlong(dt) {

            if (this.plan.fails > 6) this.plan = null;

      }
      const pt = this.path[this.pi];
      const dx = pt.x - p.x, dy = pt.y - p.y, d = Math.hypot(dx, dy);
      const sp = g.speedOf(p) * this.speedMul;
      const step = sp * dt;
      if (Math.abs(dx) > 0.02) p.facing = dx < 0 ? -1 : 1;
      if (d <= step || d < 0.05) {
        if (g.canStand(pt.x, pt.y, !p.alive)) {

    act(dt) {

      const g = this.g;
      if (pl.dyn) {
        this.dynT -= dt;
        if (this.dynT <= 0) {
          this.dynT = pl.dynEvery || 0.5;
          const tg = pl.dyn();
          if (!tg) {
            this.plan = null;
            return;
          }
          const d = U.d2(this.p.x, this.p.y, tg.x, tg.y);

      if (pl.stage === 'go') {

          if (pl.onArrive) pl.onArrive(pl);

      } else if (pl.stage === 'do') {
        if (pl.tick) pl.tick(dt, pl);

          if (this.plan === pl) this.plan = null;

    /* ---------- planos ---------- */
    planWander(areaId, idle) {
      const g = this.g;
      const pos = M.randomPointIn(areaId);
      this.setPlan({ type: 'wander', area: areaId, x: pos.x, y: pos.y, onArrive: (pl) => (pl.until = g.t + (idle != null ? idle : U.rf(2, 6))) });
    }
    planTask(tk) {
      const g = this.g, p = this.p;
      const st = g.stationOfTask(tk);
      const stepIdx = tk.step;
      const base = tk.def.dur[stepIdx] || 3;
      const dur = (base / this.pers.taskSpeed) * U.rf(0.9, 1.3) * (1 + (this.err - 1) * 0.15);
      this.setPlan({
        type: 'task', task: tk, x: st.x, y: st.y,
        onArrive: (pl) => {
          if (tk.done || tk.step !== stepIdx || !g.taskAvailable(tk)) {
            pl.until = g.t;
            return;
          }
          pl.until = g.t + dur;
          p.busy = { task: tk.id, station: st.id, until: pl.until };
          const vis = tk.def.visual;
          if (vis && vis !== 'shields' && p.alive && g.S.rules.visualTasks && (tk.def.visualStep == null || tk.def.visualStep === stepIdx)) {
            p.visual = { type: vis, until: pl.until };
          }
        },
        onDone: () => {
          if (!tk.done && tk.step === stepIdx && g.taskAvailable(tk)) g.completeStep(p, tk);
          /* pausa humana: olhar a lista, conferir o mapa, hesitar */
          if (p.alive && !this.plan) {
            const idle = U.rf(0.6, 3.2) * (this.pers.lost ? 1.6 : 1) * (this.pers.offtopic ? 1.3 : 1);
            this.setPlan({ type: 'pause', stage: 'do', until: g.t + idle });
          }
        },
      });
    }
    planFakeTask(preferArea) {
      const g = this.g, p = this.p, L = this.lvl;
      let pool = p.tasks.filter((tk) => !tk.done);
      if (!pool.length) {
        p.tasks.forEach((tk) => {
          tk.done = false;
          tk.step = 0;
        });
        pool = p.tasks.slice();
      }
      pool = pool.filter((tk) => {
        const vis = tk.def.visual && (tk.def.visualStep == null || tk.def.visualStep === tk.step);
        return !vis || U.chance(L.fakeVisual);
      });
      if (!pool.length) return this.planWander(U.pick(M.ROOMS).id);
      let tk;
      if (preferArea) tk = pool.find((x) => M.STATIONS[x.steps[x.step]].area === preferArea);
      if (!tk) {
        pool.sort((a, b) => {
          const sa = M.STATIONS[a.steps[a.step]], sb = M.STATIONS[b.steps[b.step]];
          return U.d2(p.x, p.y, sa.x, sa.y) - U.d2(p.x, p.y, sb.x, sb.y);
        });
        tk = U.chance(0.6) ? pool[0] : U.pick(pool);
      }
      const st = M.STATIONS[tk.steps[tk.step]];
      const dur = (tk.def.dur[tk.step] || 3) * U.rf(0.8, 1.4);
      this.setPlan({
        type: 'fake', task: tk, x: st.x, y: st.y,
        onArrive: (pl) => {
          pl.until = g.t + dur;
          p.busy = { task: tk.id, station: st.id, until: pl.until, fake: true };
        },
        onDone: () => {
          tk.step++;
          if (tk.step >= tk.steps.length) tk.done = true;

    }
    planReport(body) {
      const g = this.g, p = this.p;
      this.setPlan({ type: 'report', body, x: body.x, y: body.y, onArrive: () => g.tryReport(p, body) });
    }
    planButton() {
      const g = this.g, p = this.p;
      this.setPlan({
        type: 'button', x: M.EMERGENCY.x + U.rf(-0.8, 0.8), y: M.EMERGENCY.y + 1.3,
        onArrive: (pl) => {
          pl.until = g.t + 20;
        },
        tick: (dt, pl) => {
          if (g.canEmergency(p) && g.nearButton(p)) {
            g.tryEmergency(p);
          } else if (p.emergencyLeft <= 0) {
            this.wantButton = null;
            pl.until = g.t;
          }
        },
        onDone: () => (this.wantButton = null),
      });
    }
    planFix(st) {
      const g = this.g, p = this.p;
      const pos = M.SAB_STATIONS[st];
      const kind = st.startsWith('reactor') ? 'reactor' : st.startsWith('o2') ? 'o2' : st;
      this.setPlan({
        type: 'fix', st, x: pos.x, y: pos.y,
        onArrive: (pl) => {
          pl.until = g.t + (kind === 'reactor' ? 60 : kind === 'lights' ? U.rf(2, 4) : kind === 'comms' ? U.rf(3.5, 5.5) : U.rf(2.5, 4));
          p.busy = { fix: st, until: pl.until };
        },
        tick: (dt, pl) => {
          if (!g.sab || !g.sabStationsNeeded().includes(st)) {

        onDone: () => {
          const s = g.sab;
          this.fix = null;

          else if (kind === 'comms') g.fixComms(p);

    planCams(dur) {
      const g = this.g, p = this.p;
      this.setPlan({
        type: 'cams', x: M.SECURITY.x, y: M.SECURITY.y + 0.6,
        onArrive: (pl) => {

    planAdmin() {
      const g = this.g, p = this.p;
      this.setPlan({
        type: 'admin', x: M.ADMIN_TABLE.x, y: M.ADMIN_TABLE.y + 1.2,
        onArrive: (pl) => {
          pl.until = g.t + U.rf(4, 8);

            const counts = {};
            for (const q of g.players) {
              if (!q.alive || q.inVent) continue;
              const a = M.areaAt(q.x, q.y);
              if (a.kind === 'room') counts[a.id] = (counts[a.id] || 0) + 1;
            }

        },

    }
    planFollow(q, dur, keep) {
      const g = this.g;
      this.setPlan({
        type: 'follow', target: q.id, dyn: () => {
          if (!q.alive && this.p.alive) return null;
          const s = this.lastSeenAt[g.appearId(q)];
          if (!s || g.t - s.t > 5) return null;
          return { x: s.x, y: s.y };
        },
        keep: keep || 2.2, endAt: g.t + dur, dynEvery: 0.6,
      });
    }
    planFlee(threat) {
      const g = this.g, p = this.p;
      let best = null, bs = -1e9;
      for (const r of M.ROOMS) {
        const dThreat = U.d2(r.cx, r.cy, threat.x, threat.y);
        const dMe = U.d2(r.cx, r.cy, p.x, p.y);
        const s = dThreat - dMe * 0.6 + (r.id === 'cafeteria' ? 10 : 0);
        if (s > bs) {
          bs = s;
          best = r;
        }
      }
      const pos = M.randomPointIn(best.id);
      this.setPlan({ type: 'flee', x: pos.x, y: pos.y, onArrive: (pl) => (pl.until = g.t + 1.5) });
    }
    planHunt(tgt) {
      const g = this.g;
      this.setPlan({
        type: 'hunt', target: tgt.id, keep: g.killDist * 0.7, dynEvery: 0.3,
        dyn: () => {
          const s = this.lastSeenAt[g.appearId(tgt)];
          if (!tgt.alive || !s || g.t - s.t > 2.5) return null;
          return { x: s.x, y: s.y };
        },
        endAt: g.t + 20,
      });
    }
    planStalk(tgt) {
      const g = this.g;
      this.setPlan({
        type: 'stalk', target: tgt.id, keep: U.rf(4, 6), dynEvery: 0.7,
        dyn: () => {
          const s = this.lastSeenAt[g.appearId(tgt)];
          if (!tgt.alive || !s || g.t - s.t > 4) return null;
          return { x: s.x, y: s.y };
        },
        endAt: g.t + U.rf(10, 22),
      });
    }

    /* ---------- tripulante ---------- */
    hardSusp(id) {
      let s = 0;
      for (const e of this.mem.events) {
        if (e.who !== id || e.t < this.g.roundStart) continue;
        if (e.type === 'kill' || e.type === 'shift' || e.type === 'vanish') s = Math.max(s, 100);
        else if (e.type === 'vent') s = Math.max(s, 85);
      }
      return Math.max(s, (this.carry[id] || 0) > 70 ? this.carry[id] : 0);
    }
    threatNear() {
      const p = this.p, g = this.g;
      if (this.seenNow.length !== 1) return null;
      const q = this.seenNow[0];
      if (U.dist(p, q) > 5.5) return null;
      if (this.hardSusp(g.appearId(q)) >= 80) return q;
      if ((this.carry[g.appearId(q)] || 0) >= 45 && U.dist(p, q) < 4) return q;
      if (this.fear && g.t - this.fear.t < 6 && this.fear.who === g.appearId(q)) return q;
      return null;
    }
    thinkCrew() {
      const g = this.g, p = this.p;
      const body = this.bodiesNow.find((b) => !b.reported && !b.gone);
      if (body) {
        if (!this.plan || this.plan.type !== 'report' || this.plan.body !== body) {
          if (!(this.fear && g.t - this.fear.t < 1.5 && this.plan && this.plan.type === 'flee')) this.planReport(body);
        }
        if (this.plan && this.plan.type === 'report') g.tryReport(p, body);
        return;
      }
      if (this.plan && this.plan.type === 'report') {
        if (this.plan.body.reported || this.plan.body.gone) this.plan = null;
        else {
          g.tryReport(p, this.plan.body);
          return;
        }
      }
      if (this.wantButton) {
        if (p.emergencyLeft <= 0) this.wantButton = null;
        else {
          if (!this.plan || this.plan.type !== 'button') this.planButton();
          return;
        }
      }
      const threat = this.threatNear();
      if (threat && (!this.plan || this.plan.type !== 'flee')) {
        this.fear = { who: g.appearId(threat), t: g.t };
        this.planFlee(threat);
        return;
      }
      if (this.plan && this.plan.type === 'flee') return;
      if (this.fix) {
        if (!g.sab || !g.sabStationsNeeded().includes(this.fix)) {
          this.fix = null;
          if (this.plan && this.plan.type === 'fix') this.plan = null;
        } else {
          if (!this.plan || this.plan.type !== 'fix') this.planFix(this.fix);
          return;
        }
      }
      if (this.plan) return;
      this.chooseCrewActivity();
    }
    chooseCrewActivity() {
      const g = this.g, p = this.p, pers = this.pers;
      const open = p.tasks.filter((tk) => !tk.done);
      const avail = open.filter((tk) => g.taskAvailable(tk));
      if (avail.length) {
        if (pers.lost && this.lostCount < 3 && U.chance(pers.lost * 0.25 * this.err)) {
          this.lostCount++;
          return this.planWander(U.pick(M.ROOMS).id, U.rf(1, 3));
        }
        const dist = (tk) => {
          const s = g.stationOfTask(tk);
          return U.d2(p.x, p.y, s.x, s.y) + U.rf(0, 8);
        };
        let tk;
        if ((pers.lost || pers.chaos) && U.chance(0.45)) tk = U.pick(avail);
        else tk = avail.slice().sort((a, b) => dist(a) - dist(b))[0];
        return this.planTask(tk);
      }
      if (open.length) {
        const st = g.stationOfTask(open[0]);
        return this.planWander(st.area || 'medbay', U.rf(2, 5));
      }
      this.planPostTasks();
    }
    planPostTasks() {
      const g = this.g, p = this.p, pers = this.pers;
      const r = Math.random();
      const watcher = pers.leader || pers.times || pers.skeptic;
      if (watcher && r < 0.3 && !g.commsDown()) return this.planCams(U.rf(12, 25));
      if (watcher && r < 0.42 && !g.commsDown()) return this.planAdmin();
      if (pers.follow > 0.5 && r < 0.75) {
        const cand = this.seenNow.filter((q) => (this.susp[g.appearId(q)] || 0) < 30);
        if (cand.length) return this.planFollow(U.pick(cand), U.rf(12, 25));
      }
      if (pers.chaos && !this.chaosButton && U.chance(0.12) && p.emergencyLeft > 0) {
        this.chaosButton = true;
        this.wantButton = { reason: 'chaos' };
        return;
      }
      const room = U.chance(0.3) ? 'cafeteria' : U.pick(M.ROOMS).id;
      this.planWander(room);
    }

    /* ---------- impostor ---------- */
    crewVisible() {
      const g = this.g, p = this.p, t = g.t, L = this.lvl;
      if (!p.isImp) return this.seenNow.filter((q) => !q.isImp);
      /* desatenção: quem está na borda da visão às vezes passa despercebido */
      this.missed = this.missed || {};
      return this.seenNow.filter((q) => {
        if (q.isImp) return false;
        const d = U.dist(p, q);
        if (d < 4.5) return true;
        let m = this.missed[q.id];
        if (!m || t > m.until) m = this.missed[q.id] = { until: t + 1.5, miss: U.chance(L.miss || 0) };
        return !m.miss;
      });
    }
    thinkImp() {
      const g = this.g, p = this.p, t = g.t, L = this.lvl;
      if (p.inVent) return this.ventThink();
      const others = this.crewVisible();
      if (this.escape) {
        const e = this.escape;
        if (!e.decided && t - e.t0 < 7 && others.length && !g.S.house.noSelfReport && !e.body.reported) {
          if (others.some((q) => U.d2(q.x, q.y, e.body.x, e.body.y) < 9)) {
            e.decided = true;
            if (U.chance(L.selfReport)) {
              this.selfReport = true;
              this.planReport(e.body);
              return;
            }
          }
        }
        if (this.plan && this.plan.type === 'report') {
          g.tryReport(p, this.plan.body);
          return;
        }
        if (!e.moved) {
          e.moved = true;
          this.planEscape();
          return;
        }
        if (t - e.t0 > 14) this.escape = null;
        if (this.plan) return;
      }
      if (this.plan && this.plan.type === 'report') {
        if (this.plan.body.reported || this.plan.body.gone) this.plan = null;
        else {
          g.tryReport(p, this.plan.body);
          return;
        }
      }
      const body = this.bodiesNow.find((b) => !b.reported && !b.gone);
      if (body && !this.escape) {
        if (others.length && U.chance(0.35 + L.selfReport * 0.5)) {
          this.planReport(body);
          return;
        }
        if (!this.plan || (this.plan.type !== 'leave' && this.plan.type !== 'fake')) {
          const far = M.ROOMS.filter((r) => U.d2(r.cx, r.cy, body.x, body.y) > 18);
          const r = U.pick(far);
          const pos = M.randomPointIn(r.id);
          this.setPlan({ type: 'leave', x: pos.x, y: pos.y, onArrive: (pl) => (pl.until = g.t + 1) });
        }
        return;
      }
      this.sabThink -= 0.3;
      if (this.sabThink <= 0) {
        this.sabThink = U.rf(4, 9);
        this.maybeSabotage(others);
      }
      if (p.killCd > 0) this.readyT = null;
      else if (this.readyT == null) this.readyT = t;
      if (p.killCd <= 0 && !(p.invisUntil > t)) {
        const tgt = others.length === 1 ? others[0] : null;
        /* só age depois de ver a vítima isolada por um tempo, e nem sempre na primeira chance */
        if (tgt && tgt === this.isoTarget && this.noWitness(tgt, others)) this.isoT += 0.3;
        else {
          this.isoTarget = tgt;
          this.isoT = 0;
          this.eagerRoll = null;
        }
        const busy = HIGH_TRAFFIC.has(M.areaAt(tgt ? tgt.x : p.x, tgt ? tgt.y : p.y).id);
        const need = L.need * (busy ? 1.8 : 1);
        if (tgt && this.eagerRoll == null && this.isoT >= need) {
          const waited = t - this.readyT;
          this.eagerRoll = U.chance(L.eager * U.clamp(0.7 + waited / 15, 0.7, 1) * (busy ? 0.7 : 1));
          if (!this.eagerRoll) this.skipUntil = t + U.rf(1.5, 3.5);
        }
        if (this.skipUntil && t >= this.skipUntil) {
          this.skipUntil = 0;
          this.eagerRoll = null;
          this.isoT = need * 0.5;
        }
        const committed = tgt && (this.eagerRoll || (this.plan && this.plan.type === 'hunt' && this.plan.target === tgt.id));
        if (tgt && committed) {
          const d = U.dist(p, tgt);
          if (p.special === 'metamorfo' && p.abilityCd <= 0 && p.shiftAs == null && d < 9 && U.chance(0.3 + L.lie * 0.4)) {
            const disguise = U.pick(g.players.filter((q) => q.alive && q !== p && q !== tgt && !q.isImp && !others.includes(q)));
            if (disguise && this.noWitness(tgt, others)) g.shapeshift(p, disguise.id);
          }
          if (d <= g.killDist && this.safeToKill(tgt, others)) {
            if (g.tryKill(p, tgt)) return;
          }
          if (!this.plan || this.plan.type !== 'hunt' || this.plan.target !== tgt.id) {
            if (this.noWitness(tgt, others) || U.chance(L.riskTol)) this.planHunt(tgt);
          }
          return;
        } else if (!tgt && this.plan && this.plan.type === 'hunt') {
          this.plan = null;
        }
      }
      if (g.sabCritical() && !this.plan && U.chance(0.35)) {
        const st = U.pick(g.sabStationsNeeded());
        if (st) {
          const pos = M.SAB_STATIONS[st];
          this.setPlan({ type: 'loiter', x: pos.x + U.rf(-2, 2), y: pos.y + U.rf(-2, 2), onArrive: (pl) => (pl.until = g.t + U.rf(2, 5)) });
          return;
        }
      }
      if (!this.plan) this.chooseImpActivity(others);
    }
    noWitness(tgt, others) {
      const g = this.g, p = this.p;
      if (others.length > 1) return false;
      for (const id of Object.keys(this.lastSeenAt)) {
        const s = this.lastSeenAt[id];
        const q = g.players[+id];
        if (!q || q.isImp || q === tgt || !q.alive) continue;
        if (g.t - s.t < 1.6 && U.d2(s.x, s.y, p.x, p.y) < 10 && !others.some((o) => g.appearId(o) === +id)) return false;
      }
      return true;
    }
    safeToKill(tgt, others) {
      const g = this.g, p = this.p, L = this.lvl;
      if (others.length > 1) return U.chance(L.riskTol * 0.25);
      if (!this.noWitness(tgt, others) && !U.chance(L.riskTol)) return false;
      if (L.camsAware && g.anyoneOnCams() && M.CAMS.some((c) => U.d2(c.x, c.y, p.x, p.y) <= M.CAM_R && Nav.los(c.x, c.y, p.x, p.y))) return false;
      if (g.S.house.noDoubleKill && g.partnerKilledRecently(p)) return false;
      return true;
    }
    planEscape() {
      const g = this.g, p = this.p, L = this.lvl;
      const e = this.escape;
      const clear = this.crewVisible().length === 0;
      let vent = null, vd = 7;
      for (const v of M.VENTS) {
        const d = U.d2(p.x, p.y, v.x, v.y);
        if (d < vd) {
          vd = d;
          vent = v;
        }
      }
      if (vent && clear && U.chance(L.useVents)) {
        this.setPlan({
          type: 'toVent', x: vent.x, y: vent.y,
          onArrive: (pl) => {
            pl.until = g.t;
            const vis = this.crewVisible().length;
            if (vis === 0 || U.chance(L.riskTol)) {
              if (g.enterVent(p, vent)) {
                const opts = [];
                vent.links.forEach((l) => {
                  opts.push([l]);
                  M.VENT[l].links.forEach((l2) => {
                    if (l2 !== vent.id) opts.push([l, l2]);
                  });
                });
                this.ventPlan = { steps: U.pick(opts).slice(), nextT: g.t + U.rf(0.5, 1) };
              }
            }
          },
        });
        return;
      }
      if (p.special === 'fantasma' && p.abilityCd <= 0 && U.chance(0.7)) g.vanish(p);
      const far = M.ROOMS.filter((r) => r.id !== e.area && U.d2(r.cx, r.cy, p.x, p.y) > 14 && U.d2(r.cx, r.cy, p.x, p.y) < 45);
      const room = far.length ? U.pick(far) : U.pick(M.ROOMS);
      if (U.chance(0.6)) this.planFakeTask(room.id);
      else this.planWander(room.id, U.rf(2, 5));
    }
    ventThink() {
      const g = this.g, p = this.p, t = g.t;
      const vp = this.ventPlan || (this.ventPlan = { steps: [], nextT: t + 1 });
      if (t < vp.nextT) return;
      if (vp.steps.length) {
        g.ventTo(p, vp.steps.shift());
        vp.nextT = t + U.rf(0.6, 1.1);
        return;
      }
      const r = g.visionOf(p);
      const vis = g.players.filter((q) => q.alive && !q.isImp && !q.inVent && U.d2(q.x, q.y, p.x, p.y) <= r && Nav.los(p.x, p.y, q.x, q.y));
      if (vis.length === 0 || t - p.ventT > 12) {
        g.exitVent(p);
        this.ventPlan = null;
        const a = M.areaAt(p.x, p.y);
        if (U.chance(0.7)) this.planFakeTask(M.roomOf(a, p.x, p.y).id);
        else this.planWander(M.roomOf(a, p.x, p.y).id, U.rf(1, 3));
      } else {
        const cur = M.VENT[p.inVent];
        if (U.chance(0.5)) vp.steps.push(U.pick(cur.links));
        vp.nextT = t + U.rf(0.7, 1.3);
      }
    }
    maybeSabotage(others) {
      const g = this.g, p = this.p, L = this.lvl;
      if (!g.canSabotage(p)) return;
      const lastKill = Math.max(...g.players.filter((q) => q.isImp).map((q) => q.lastKillT));
      const sinceKill = g.t - Math.max(lastKill, g.roundStart);
      if (L.sabKill && others.length === 1 && p.killCd < 3 && U.chance(0.35)) return g.sabotage('lights', p);
      if (others.length === 1 && p.killCd < 2 && U.chance(L.sabotage * 0.5)) {
        const a = M.roomOf(M.areaAt(p.x, p.y), p.x, p.y);
        const ta = M.areaAt(others[0].x, others[0].y);
        if (a && ta && a.id === ta.id && M.DOOR_ROOMS.includes(a.id) && g.doorReady(a.id)) return g.closeDoors(a.id, p);
      }
      if (this.escape && g.t - this.escape.t0 < 8 && L.camsAware && g.critAllowed() && U.chance(0.3)) return g.sabotage(U.pick(['reactor', 'o2']), p);
      if (sinceKill > 50 && g.critAllowed() && U.chance(L.sabotage * 0.22)) return g.sabotage(U.pick(['reactor', 'o2', 'lights']), p);
      if (g.anyoneOnCams() && U.chance(L.sabotage * 0.25)) return g.sabotage('comms', p);
      if (U.chance(L.sabotage * 0.07)) return g.sabotage(U.pick(['lights', 'comms']), p);
    }
    chooseImpActivity(others) {
      const g = this.g, L = this.lvl;
      const r = Math.random();
      if (r < L.stalk * 0.45) {
        const cands = others.length ? others : [];
        if (cands.length) return this.planStalk(U.pick(cands));
      }
      if (r < 0.7) return this.planFakeTask();
      if (r < 0.82) {
        const crowd = this.seenNow.filter((q) => !q.isImp);
        if (crowd.length >= 2) return this.planFollow(U.pick(crowd), U.rf(8, 15), 3);
      }
      this.planWander(U.chance(0.25) ? 'cafeteria' : U.pick(M.ROOMS).id);
    }

    /* ---------- funções especiais ---------- */
    thinkRoles() {
      const g = this.g, p = this.p, t = g.t;
      if (p.special === 'cientista') {
        this.vitalsT -= 0.3;
        if (this.vitalsT <= 0 && p.battery >= 2) {
          this.vitalsT = U.rf(18, 30);
          p.battery -= 2;
          for (const q of g.players) {
            if (!q.alive && !q.ejected && !this.mem.vitals[q.id]) this.mem.vitals[q.id] = { from: this.lastVitals, to: t };
          }
          this.lastVitals = t;
        }
      }
      if (p.special === 'rastreador' && p.abilityCd <= 0) {
        const cand = this.seenNow.filter((q) => U.dist(p, q) < 3.4);
        if (cand.length) {
          cand.sort((a, b) => (this.susp[g.appearId(b)] || 0) - (this.susp[g.appearId(a)] || 0));
          g.track(p, cand[0].id);
        }
      }
      if (p.special === 'engenheiro' && !p.inVent && p.abilityCd <= 0 && this.seenNow.length === 0 && U.chance(0.01)) {
        const v = g.nearestVent(p);
        if (v && g.enterVent(p, v)) {
          this.engVent = { exitAt: t + U.rf(1.5, 3), next: U.pick(v.links) };
        }
      }
      if (p.inVent && this.engVent) {
        if (this.engVent.next) {
          g.ventTo(p, this.engVent.next);
          this.engVent.next = null;
        } else if (t >= this.engVent.exitAt) {
          g.exitVent(p);
          this.engVent = null;
          this.plan = null;
        }
      }
    }

    /* ---------- fantasma ---------- */
    ghostUpdate(dt) {
      const g = this.g, p = this.p;
      this.thinkT -= dt;
      if (this.thinkT <= 0) {
        this.thinkT = 0.5;
        if (p.isImp) {
          this.sabThink -= 0.5;
          if (this.sabThink <= 0) {
            this.sabThink = U.rf(12, 25);
            if (g.canSabotage(p) && U.chance(this.lvl.sabotage * 0.5)) {
              const opts = ['lights', 'comms'];
              if (g.critAllowed()) opts.push('reactor', 'o2');
              g.sabotage(U.pick(opts), p);
            }
          }
          if (!this.plan) this.planWander(U.pick(M.ROOMS).id, U.rf(3, 8));
        } else if (p.special === 'anjo' && p.abilityCd <= 0) {
          const cands = g.players.filter((q) => q.alive);
          cands.sort((a, b) => (this.susp[a.id] || 0) - (this.susp[b.id] || 0));
          const tg = cands[Math.min(cands.length - 1, U.rint(0, 2))];
          if (tg) {
            if (U.dist(p, tg) <= 3.5) {
              g.protect(p, tg.id);
              this.plan = null;
            } else if (!this.plan || this.plan.type !== 'guard') {
              this.setPlan({ type: 'guard', dyn: () => (tg.alive ? { x: tg.x, y: tg.y } : null), keep: 2.5, endAt: g.t + 20, dynEvery: 0.8 });
            }
          }
        } else if (!this.plan) {
          const avail = p.tasks.filter((tk) => !tk.done && g.taskAvailable(tk));
          if (avail.length) {
            avail.sort((a, b) => {
              const sa = g.stationOfTask(a), sb = g.stationOfTask(b);
              return U.d2(p.x, p.y, sa.x, sa.y) - U.d2(p.x, p.y, sb.x, sb.y);
            });
            this.planTask(avail[0]);
          } else this.planWander(U.pick(M.ROOMS).id, U.rf(3, 8));
        }
      }
      this.act(dt);
    }

    /* ---------- percepção e eventos ---------- */
    confuse(id) {
      const q = this.g.players[id];
      const alts = (C.CONFUSABLE[q.color] || []).map((c) => this.g.players.find((x) => x.color === c)).filter(Boolean);
      return alts.length ? U.pick(alts).id : id;
    }
    perceive(seen, bodies, via) {
      const g = this.g, p = this.p, t = g.t, pers = this.pers, mem = this.mem;
      if (via === 'eyes') {
        this.seenNow = seen;
        this.bodiesNow = bodies.slice();
      } else {
        for (const b of bodies) if (!this.bodiesNow.includes(b)) this.bodiesNow.push(b);
      }
      for (const q of seen) {
        const aid = g.appearId(q);
        const area = M.areaAt(q.x, q.y).id;
        this.lastSeenAt[aid] = { t, x: q.x, y: q.y, area };
        const l = mem.last[aid];
        const isNew = !l || l.area !== area || t - l.t1 > 2.5 || l.via !== via;
        if (isNew && U.chance((1 - pers.att) * 0.2 * this.err)) mem.ignoreUntil[aid] = t + 3;
        if ((mem.ignoreUntil[aid] || 0) > t) continue;
        let act = null;
        if (q.visual && g.S.rules.visualTasks) act = 'visual';
        else if (q.busy) act = 'task';
        else if (q.onCams) act = 'cams';
        else if (q.onAdmin) act = 'admin';
        mem.see(t, aid, area, act, via, q.x, q.y);
        if (act === 'visual') mem.event({ type: 'visual', t, who: aid, task: q.visual.type, area, via }, 'visual:' + aid + ':' + g.meetings);
        if (via === 'eyes' && !p.isImp && seen.length === 1 && U.dist(p, q) < 5 && t >= g.roundStart + 9) {
          this.aloneWith = this.aloneWith || {};
          this.aloneWith[aid] = (this.aloneWith[aid] || 0) + 0.2;
        }
        if (via === 'eyes' && !p.isImp) {
          const d = U.dist(p, q);
          if (d < 3.8 && q.moving && p.moving) this.followWatch[aid] = (this.followWatch[aid] || 0) + 0.2;
          else this.followWatch[aid] = Math.max(0, (this.followWatch[aid] || 0) - 0.08);
          if (this.followWatch[aid] >= 7) {
            this.followWatch[aid] = 0;
            if (mem.event({ type: 'follow', t, who: aid, area }, 'follow:' + aid + ':' + g.meetings) && pers.panic) {
              this.fear = { who: aid, t };
              this.planFlee(q);
            }
          }
          if (g.S.rules.visualTasks && U.d2(q.x, q.y, M.STATIONS.scan.x, M.STATIONS.scan.y) < 0.9 && !q.visual && !q.moving) {
            this.scanWatch[aid] = (this.scanWatch[aid] || 0) + 0.2;
            if (this.scanWatch[aid] >= 3.2) mem.event({ type: 'noscan', t, who: aid, area }, 'noscan:' + aid + ':' + g.meetings);
          }
        }
      }
      for (const b of bodies) mem.bodySeen(b, t, seen.map((q) => g.appearId(q)), via);
      /* quem anda junto de quem (base para "o X estava seguindo o Y") */
      if (via === 'eyes' && seen.length >= 2 && seen.length <= 4) {
        for (let i = 0; i < seen.length; i++) for (let j = i + 1; j < seen.length; j++) {
          const a = seen[i], b = seen[j];
          if (U.dist(a, b) > 4.5) continue;
          const ia = g.appearId(a), ib = g.appearId(b);
          const key = ia < ib ? ia + ':' + ib : ib + ':' + ia;
          const pr = mem.pairs[key];
          const area = M.areaAt(a.x, a.y).id;
          if (pr && t - pr.t1 < 3) {
            pr.t1 = t;
            pr.n++;
            pr.area = area;
          } else mem.pairs[key] = { a: ia, b: ib, t0: t, t1: t, n: 1, area, alone: seen.length === 2 };
        }
      }
    }
    perceiveTrack(q) {
      const g = this.g;
      if (g.t - this.trackT < 1) return;
      this.trackT = g.t;
      this.mem.track.push({ who: q.id, area: M.areaAt(q.x, q.y).id, t: g.t });
    }
    onWitnessKill(apparent, victimId, area, via, body) {
      const g = this.g, pers = this.pers;
      if (this.p.isImp) {
        this.mem.event({ type: 'partnerKill', t: g.t, who: apparent, victim: victimId, area });
        return;
      }
      if (!U.chance(0.9 + 0.1 * pers.att)) return;
      let who = apparent;
      if (U.chance((1 - pers.mem) * 0.1 * this.err)) who = this.confuse(who);
      this.mem.event({ type: 'kill', t: g.t, who, victim: victimId, area, via }, 'kill:' + victimId);
      this.susp[who] = 100;
      if (pers.panic || via === 'cams') this.fear = { who, t: g.t };
      this.wantButton = { reason: 'kill', who, victim: victimId, area };
      if (pers.panic) this.planFlee(g.players[apparent]);
    }
    onWitnessVent(apparent, dir, v, via) {
      const g = this.g, p = this.p, pers = this.pers;
      if (p.isImp) return;
      if (!U.chance(0.55 + 0.45 * pers.att)) return;
      let who = apparent;
      if (U.chance((1 - pers.mem) * 0.08 * this.err)) who = this.confuse(who);
      if (this.mem.event({ type: 'vent', t: g.t, who, area: v.area, dir, via }, 'vent:' + who + ':' + g.meetings)) {
        const engineers = (g.S.roles.engenheiro || {}).n > 0;
        if ((!engineers || pers.hunch > 0.2) && p.emergencyLeft > 0) this.wantButton = { reason: 'vent', who, area: v.area };
      }
    }
    onWitnessShift(realId, intoId, via) {
      const g = this.g;

      if (tog[id] > bt && this.mem.seen.some((s) => s.who === +id && s.t1 >= this.graceT() && rooms.includes(s.area))) {
        bt = tog[id];
        best = +id;
      }
    }
    return best;
  };

  /* O álibi da reunião é decidido uma vez só: o que o bot conta e o que a IA escreve precisam bater. */
  B.getAlibi = function () {
    if (!this.alibi) {
      const rooms = this.myRooms();
      this.alibi = { rooms, task: this.myTask(rooms), with: this.p.isImp ? null : this.companion(rooms) };
    }
    return this.alibi;
  };

  /* Em quem o tripulante votaria agora (sem sorteio), para a fala combinar com o voto. */
  B.voteLean = function () {
    if (!this.mt) return null;
    if (this.p.isImp) return this.impTarget();
    const ranked = this.mt.alive.filter((id) => id !== this.p.id).map((id) => ({ id, s: this.susp[id] || 0 })).sort((a, b) => b.s - a.s);
    const top = ranked[0], second = ranked[1] || { s: -999 };
    return top && top.s >= this.pers.thr && top.s - second.s >= 8 ? top.id : null;
  };

  /* Motivo curto do voto, só com o que o bot sabe. */
  B.voteReason = function (v) {

    if (v === 'skip' || v == null) return this.p.isImp ? 'não tem nada concreto' : 'sem prova suficiente';
    if (this.p.isImp) return v === this.scapegoat ? 'desconfia dele desde o começo' : mt.votesOn(v) >= 2 ? 'a maioria está votando nele' : 'o álibi dele não convenceu';
    const ev = ((this.ev && this.ev[v]) || []).filter((e) => e.w > 0).sort((a, b) => b.w - a.w)[0];
    if (ev) {
      const t = { kill: 'viu matando', vent: 'viu no duto', shift: 'viu mudando de forma', vanish: 'viu sumindo', noscan: 'fingiu o scan', follow: 'estava seguindo', nearBody: 'estava perto do corpo', lastWith: 'estava com a vítima', withVictim: 'andava com a vítima' }[ev.reason];
      if (t) return t;
    }
    if ((this.chatDelta[v] || 0) > 8) return 'o álibi não bate com o que viu';
    if ((this.chatClaim[v] || 0) > 12) return 'acusaram com prova no chat';
    if (mt.votesOn(v) >= 2) return 'a maioria está votando nele';
    void g;
    return 'está suspeito';

  B.compose = function (it) {
    const g = this.g, p = this.p, mt = this.mt, pers = this.pers;
    const msg = (kind, d, intents, opts) => ({ text: this.say(kind, d, opts), intents: intents || [] });
    switch (it.k) {
      case 'reportInfo': {
        const b = mt.info.body;
        return msg('reportInfo', { area: b.area, victim: b.pid }, [{ type: 'reportInfo', area: b.area, victim: b.pid }]);
      }
      case 'reportDetail': {
        const b = mt.info.body;
        if (p.isImp) {
          if (!this.selfReport && U.chance(0.4)) return null;
          return msg('reportWhy', { task: this.fakeTask, area: b.area }, []);
        }
        const mb = this.mem.bodies.find((x) => x.id === b.id);
        const near = mb ? mb.near.filter((id) => id !== p.id && g.players[id].alive) : [];
        if (near.length) return msg('sawNearBody', { who: near[0], area: b.area, bodyArea: b.area }, [{ type: 'accuse', who: near[0], reason: 'nearBody', area: b.area }]);
        return msg('noOneNear', { area: b.area }, []);
      }
      case 'callReason': {
        const w = this.wantButton || { reason: this.p.isImp ? 'info' : 'chaos' };
        if (p.isImp && this.scapegoat != null && U.chance(this.lvl.lie)) {
          return msg('accuse', { who: this.scapegoat, reason: 'hunch' }, [{ type: 'accuse', who: this.scapegoat, reason: 'hunch' }]);
        }
        const intents = w.who != null && STRONG[w.reason] ? [{ type: 'accuse', who: w.who, reason: w.reason, area: w.area, victim: w.victim, strong: true }] : [];
        return msg('callReason', w, intents, { strong: !!intents.length });
      }
      case 'organize':
        return msg('organize', {}, [{ type: 'askAll' }]);
      case 'accuse': {

        return msg('accuse', it, [{ type: 'accuse', who: it.who, reason: it.reason, area: it.area, victim: it.victim, strong: !!STRONG[it.reason] }], { strong: !!STRONG[it.reason] });
      }

        const leftAgo = segs.length > 1 ? Math.round((mt.info.t - segs[segs.length - 2].t1) / 5) * 5 : null;
        if (!rooms.length) return msg('claimNone', {}, []);
        return msg('claimLoc', { rooms, with: w, task, times: pers.times, leftAgo }, [{ type: 'claimLoc', rooms, with: w != null ? [w] : [] }]);

        list.sort((a, b) => b.w - a.w);
        const top = list[0];
        if (!top) return U.chance(0.35) ? msg('noOneNear', { area: this.knowsBody }, []) : null;
        let who = top.who;
        if (U.chance((1 - pers.mem) * 0.12 * this.err)) who = this.confuse(who);
        if (top.reason === 'lastWith') return msg('lastWithVictim', { who, victim: top.victim, area: top.area }, [{ type: 'accuse', who, reason: 'lastWith', area: top.area }]);
        if (top.reason === 'withVictim') return msg('withVictim', { who, victim: top.victim, area: top.area }, [{ type: 'accuse', who, reason: 'lastWith', area: top.area }]);
        const ago = mt.info.t - (top.t || mt.info.t);
        const intent = top.w >= 15 ? { type: 'accuse', who, reason: 'nearBody', area: top.area } : { type: 'sawAt', who, area: top.area };
        return msg('sawNearBody', { who, area: top.area, bodyArea: this.knowsBody, ago, times: pers.times }, [intent]);
      }
      case 'vouch': {
        const q = g.players[it.who];
        if (!q || !q.alive) return null;
        return msg('vouch', it, [{ type: 'vouch', who: it.who, reason: it.reason, task: it.task }]);
      }
      case 'vitals': {
        const b = mt.info.body;
        const ids = Object.keys(this.mem.vitals).map(Number).filter((id) => !g.players[id].ejected);
        const id = b ? b.pid : ids[ids.length - 1];
        const v = this.mem.vitals[id];
        if (!v) return null;
        const ago = Math.max(5, Math.round((mt.info.t - (v.from + v.to) / 2) / 5) * 5);
        return msg('vitals', { victim: id, ago }, []);
      }
      case 'tracker': {
        const tr = this.mem.track.filter((x) => x.t >= this.rs);
        if (!tr.length) return null;
        const who = tr[0].who;
        const areas = [];
        tr.filter((x) => x.who === who).forEach((x) => {
          if (areas[areas.length - 1] !== x.area) areas.push(x.area);

      }
      case 'camsInfo': {
        const segs = this.mem.seen.filter((s) => s.via === 'cams' && s.t1 >= this.rs && g.players[s.who].alive);
        if (!segs.length) return null;
        let s = segs[segs.length - 1];
        if (this.knowsBody) s = segs.find((x) => x.area === this.knowsBody || M.isNear(x.area, this.knowsBody)) || s;
        return msg('camsInfo', { who: s.who, area: s.area }, [{ type: 'sawAt', who: s.who, area: s.area }]);
      }
      case 'adminInfo': {
        const a = this.mem.admin.filter((x) => x.t >= this.rs).pop();
        if (!a) return null;
        let area = this.knowsBody && a.counts[this.knowsBody] ? this.knowsBody : null;
        if (!area) {
          const ks = Object.keys(a.counts);
          if (!ks.length) return null;
          area = U.pick(ks);
        }
        return msg('adminInfo', { area, n: a.counts[area] }, []);
      }
      case 'hunch': {
        const ids = g.players.filter((q) => q.alive && q !== p).map((q) => q.id);
        ids.sort((a, b) => (this.susp[b] || 0) - (this.susp[a] || 0));
        const who = U.chance(0.6) ? ids[0] : U.pick(ids);
        if (who == null) return null;
        return msg('accuse', { who, reason: 'hunch' }, [{ type: 'accuse', who, reason: 'hunch' }]);
      }
      case 'frame': {
        const who = this.scapegoat;
        if (who == null || !g.players[who].alive) return null;
        const bodyArea = mt.facts.bodyArea || (mt.info.body && mt.info.body.area);
        if (this.scapegoatReal && bodyArea) return msg('sawNearBody', { who, area: bodyArea, bodyArea }, [{ type: 'accuse', who, reason: 'nearBody', area: bodyArea }]);
        if (this.lvl.lie >= 0.9 && bodyArea) return msg('sawNearBody', { who, area: bodyArea, bodyArea }, [{ type: 'accuse', who, reason: 'nearBody', area: bodyArea, fake: true }]);
        return msg('accuse', { who, reason: 'hunch' }, [{ type: 'accuse', who, reason: 'hunch' }]);
      }
      case 'offtopic':
        return msg('offtopic', {}, []);
      case 'lost': {
        const r = U.pick(M.ROOMS).id;
        return msg('lost', { area: r }, []);
      }
      case 'askHuman': {
        const h = g.human;
        if (!h || !h.alive || mt.humanClaimed) return null;
        this.askedHuman = true;
        mt.askedHumanAt = mt.t;
        mt.askedHumanBy = p.id;
        return msg('askWhere', { who: h.id }, [{ type: 'askWhere', who: h.id }], { question: true });
      }
      case 'leaderVote': {
        if (mt.phase !== 'voting' && mt.t < mt.durD * 0.6) {
          if ((it.tries = (it.tries || 0) + 1) < 4) {

            return null;
          }
        }
        const top = this.topSuspect();
        if (p.isImp) {
          const t2 = this.impTarget();
          return msg('leaderVote', { who: t2 }, t2 != null ? [{ type: 'accuse', who: t2, reason: 'vote' }] : [{ type: 'skip' }]);
        }
        if (top && top.s >= this.pers.thr) return msg('leaderVote', { who: top.id }, [{ type: 'accuse', who: top.id, reason: 'vote' }]);
        return msg('leaderVote', { who: null }, [{ type: 'skip' }]);
      }
      default:
        return null;
    }
  };

  B.topSuspect = function () {
    const mt = this.mt;
    let best = null;
    for (const id of mt.alive) {
      if (id === this.p.id) continue;
      const s = this.susp[id] || 0;
      if (!best || s > best.s) best = { id, s };
    }
    return best;
  };

  /* ---------- reações ---------- */
  B.reply = function (delay, fn, direct) {
    const mt = this.mt;
    if (!mt || mt.closed) return;
    const src = this.curMsg;
    const so = this.curMsgObj;
    const meta = { kind: 'reply', direct: !!direct, toHuman: !!(so && so.fromHuman), srcFrom: so ? so.from : null, srcText: so ? so.text : null };
    if (!direct) {
      if (this.budget <= 0) return;
      if (src != null && !mt.canReply(src)) return;
      this.budget--;
      if (src != null) mt.noteReply(src);
    }
    /* com IA o diretor cuida do ritmo: a reação entra logo na fila da próxima rodada */
    const viaAI = mt.dir && mt.dir.accepts(meta);
    const wait = viaAI ? U.rf(0.15, meta.toHuman ? 0.3 : 1.2) : delay * mt.pace + U.rf(0.8, 2.4);
    mt.schedule(wait, this, () => {
      if (!this.p.alive || mt.closed) return;
      const m = fn();
      if (m && m.text) mt.say(this, m, meta);
    }, { ttl: direct ? 20 : 9, raw: viaAI });
  };

  B.mOnMessage = function (msg) {
    if (!this.mt || msg.from === this.p.id || !this.p.alive) return;
    const g = this.g, p = this.p;
    this.curMsg = msg.id;
    this.curMsgObj = msg;
    for (const it of msg.intents) {
      try {
        this.react(msg, it);
      } catch (e) {
        if (window.console) console.warn('reação falhou', e);
      }
    }
    if (msg.fromHuman && !msg.intents.length && U.chance(0.12 + this.pers.talk * 0.1) && !this.replied.has('huh' + msg.id)) {
      this.replied.add('huh' + msg.id);
      this.reply(1, () => ({ text: this.say('huh'), intents: [] }));
    }
    this.curMsg = null;
    this.curMsgObj = null;
    void g;
    void p;
  };

  B.react = function (msg, it) {
    const g = this.g, p = this.p, mt = this.mt, pers = this.pers, me = p.id, S = msg.from;
    const say = (kind, d, intents, opts) => ({ text: this.say(kind, d, opts), intents: intents || [] });
    switch (it.type) {
      case 'reportInfo':
      case 'bodyArea': {
        if (!this.knowsBody && it.area) {
          this.knowsBody = it.area;
          if (!p.isImp) this.bodyEvidence(it.area);
        }
        break;
      }
      case 'askAll':
        if (!this.claimed) this.reply(1, () => this.compose({ k: 'claimLoc' }), true);
        break;
      case 'askWhere':
        if (it.who === me) {
          if (!this.claimed) this.reply(pers.talk < 0.3 ? 2.5 : 1, () => this.compose({ k: 'claimLoc' }), true);
          else if (!this.replied.has('reclaim')) {
            this.replied.add('reclaim');
            this.reply(1, () => {
              this.claimed = false;
              return this.compose({ k: 'claimLoc' });
            }, true);
          }
        }
        break;
      case 'askBody':
        if (this.knowsBody && this.sawBodyMyself && !this.replied.has('body')) {
          this.replied.add('body');
          this.reply(0.6, () => say('answerBody', { area: this.knowsBody }, [{ type: 'bodyArea', area: this.knowsBody }]), true);
        }
        break;
      case 'claimLoc':
        this.claims[S] = it.rooms;
        if (S === g.human?.id) mt.humanClaimed = true;
        if (!p.isImp) this.checkClaim(S, it);
        else this.impOnClaim(S, it);
        break;
      case 'sawAt':
        this.checkSawAt(S, it);
        break;
      case 'accuse':
        this.onAccuse(S, it);
        break;
      case 'vouch':
        this.onVouch(S, it);
        break;
      case 'deny':
        if (this.lastAccusation && this.lastAccusation.who === S && STRONG[this.lastAccusation.reason] && !this.replied.has('restate' + S)) {
          this.replied.add('restate' + S);
          this.reply(1, () => say('accuse', this.lastAccusation, [{ type: 'accuse', who: S, reason: this.lastAccusation.reason, strong: true }], { strong: true }), true);
        } else if (pers.skeptic && U.chance(0.3) && !this.replied.has('denyq' + S)) {
          this.replied.add('denyq' + S);
          this.reply(1.2, () => say('askConfirm', { who: S }, []));
        }
        break;
      case 'skip':
        this.skipLean++;
        break;
      case 'askProof':
        if (this.lastAccusation && !this.replied.has('proof')) {
          this.replied.add('proof');
          this.reply(1, () => say('accuse', this.lastAccusation, [{ type: 'accuse', who: this.lastAccusation.who, reason: this.lastAccusation.reason }]), true);
        }
        break;
      case 'askWho':
        if (!this.replied.has('who' + msg.id) && U.chance(0.25 + pers.talk * 0.4)) {
          this.replied.add('who' + msg.id);
          this.reply(1.2, () => {
            const top = p.isImp ? { id: this.impTarget(), s: 50 } : this.topSuspect();
            const who = top && top.id != null && top.s >= this.pers.thr * 0.6 ? top.id : null;
            return say('whoSus', { who }, who != null ? [{ type: 'accuse', who, reason: 'sus' }] : []);
          });
        }
        break;
      case 'mention':
        if (it.who === me && msg.fromHuman && !this.replied.has('ment' + msg.id)) {
          this.replied.add('ment' + msg.id);
          this.reply(0.8, () => say('huh', {}, []), true);
        } else if (msg.fromHuman && (pers.defend || pers.skeptic) && U.chance(0.35)) {
          this.reply(1.2, () => say('askProof', { who: it.who }, [{ type: 'askProof' }]));
        }
        break;
      case 'quiet':
        if (it.who !== me) this.bump(it.who, 3, 'social');
        break;
      default:
        break;
    }
  };

  B.sawTimes = function (id) {
    const g0 = this.graceT();
    return this.mem.seen.filter((s) => s.who === id && s.t1 >= g0 && s.via !== 'track');
  };
  B.myStay = function (area) {
    let tot = 0;
    const from = Math.max(this.graceT(), this.mt ? this.mt.info.t - 30 : 0);
    for (const s of this.mem.trail) if (s.t1 >= from && s.area === area) tot += s.t1 - Math.max(s.t0, from);
    return tot;
  };

  B.checkClaim = function (S, it) {
    const g = this.g, me = this.p.id, pers = this.pers;
    const say = (kind, d, intents, opts) => ({ text: this.say(kind, d, opts), intents: intents || [] });
    const rooms = it.rooms || [];
    const withIds = it.with || [];
    if (withIds.includes(me)) {
      const tog = this.togetherMap()[S] || 0;
      if (tog >= 5) {
        this.bump(S, -10);
        this.reply(0.9, () => say('confirmWith', { who: S }, [{ type: 'vouch', who: S, reason: 'together' }]), true);
      } else {
        this.bump(S, 30);
        this.reply(0.9, () => say('denyWith', { who: S }, [{ type: 'accuse', who: S, reason: 'lie' }]), true);
      }
      return;
    }
    const seen = this.sawTimes(S);
    const matchR = (area) => rooms.some((r) => r === area || M.isNear(r, area));
    if (!seen.length) {
      for (const r of rooms) {
        const stay = this.myStay(r);
        if (stay >= 15 && U.chance(0.25 + (pers.skeptic ? 0.3 : 0))) {
          this.bump(S, 12, 'social');
          this.reply(1.2, () => say('contradictStay', { who: S, area: r }, [{ type: 'accuse', who: S, reason: 'lie' }]));
          return;
        }
      }
      if (pers.skeptic && !withIds.length && U.chance(0.3)) this.reply(1.3, () => say('askConfirm', { who: S }, []));
      return;
    }
    const recent = this.mt.info.t - 30;
    const matches = seen.filter((s) => matchR(s.area));
    const mism = seen.filter((s) => !matchR(s.area) && s.t1 >= recent && s.t1 - s.t0 >= 1.2 && !matches.some((m) => m.t1 > s.t1));
    if (matches.length && U.chance(0.35 + pers.talk * 0.3)) {
      this.bump(S, -7);
      const s = matches[matches.length - 1];
      this.reply(1.1, () => say('confirm', { who: S, area: s.area }, [{ type: 'vouch', who: S, reason: 'claim' }]));
    } else if (mism.length) {
      const s = mism[mism.length - 1];
      const rel = this.knowsBody && (s.area === this.knowsBody || M.isNear(s.area, this.knowsBody));
      if (rel || U.chance(0.3)) {
        this.bump(S, rel ? 28 : 10);
        this.reply(1, () => say('contradictSeen', { who: S, area: s.area, claimed: rooms[rooms.length - 1] }, [{ type: 'accuse', who: S, reason: 'lie', area: s.area }]));
      }
    }
    void g;
  };

  B.impOnClaim = function (S, it) {
    const g = this.g, L = this.lvl;
    const say = (kind, d, intents) => ({ text: this.say(kind, d), intents: intents || [] });
    const q = g.players[S];
    if (q && q.isImp && q !== this.p && U.chance(L.lie * 0.3) && it.rooms && it.rooms.length) {

    }
    if (q && !q.isImp && (it.with || []).includes(this.p.id)) {
      this.reply(1, () => say('confirmWith', { who: S }, [{ type: 'vouch', who: S, reason: 'together' }]), true);
    }
  };

  B.checkSawAt = function (S, it) {
    const me = this.p.id, T2 = it.who;
    const say = (kind, d, intents) => ({ text: this.say(kind, d), intents: intents || [] });
    if (T2 === me) {
      if (this.p.isImp) {
        if (!this.fakeRooms.includes(it.area) && U.chance(0.5)) this.reply(1, () => say('notThere', { area: it.area, mine: this.fakeRooms[this.fakeRooms.length - 1] }, [{ type: 'deny' }]), true);
        return;
      }
      const stay = this.myStay(it.area) + this.mem.trail.filter((s) => s.t1 >= this.rs && M.isNear(s.area, it.area)).length;
      if (stay > 0) {
        if (U.chance(0.4)) this.reply(1, () => say('wasThere', { area: it.area }, []));
      } else {
        this.bump(S, 20);
        const mine = this.myRooms();
        this.reply(1, () => say('notThere', { area: it.area, mine: mine[mine.length - 1] }, [{ type: 'accuse', who: S, reason: 'lie' }]), true);
      }
      return;
    }
    if (this.p.isImp) return;
    const seen = this.sawTimes(T2);
    if (seen.some((s) => s.area === it.area || M.isNear(s.area, it.area))) {
      this.bump(T2, 6);
      if (U.chance(0.35)) this.reply(1.2, () => say('confirm', { who: T2, area: it.area }, []));
    } else {
      this.bump(T2, 8 * this.trust(S), 'social');
    }
  };

  B.onAccuse = function (S, it) {
    const g = this.g, p = this.p, me = p.id, pers = this.pers, L = this.lvl, mt = this.mt;
    const T2 = it.who;
    const target = g.players[T2];
    if (!target) return;
    const say = (kind, d, intents, opts) => ({ text: this.say(kind, d, opts), intents: intents || [] });
    const strong = STRONG[it.reason] || 0;
    const w = CLAIM_W[it.reason] || 15;
    if (T2 === me) {
      this.accusedMe[S] = (this.accusedMe[S] || 0) + 1;
      this.denies = (this.denies || 0) + 1;
      if (this.accusedMe[S] > 1 || this.denies > 3) return;
      const mine = this.myRooms();
      const area = mine[mine.length - 1];
      if (!p.isImp) {
        this.bump(S, strong ? 45 : 10);
        if (strong && !pers.defend && U.chance(0.6)) this.reply(0.8, () => say('denyStrong', { accuser: S, area }, [{ type: 'deny' }, { type: 'accuse', who: S, reason: 'lie' }], { strong: true }), true);
