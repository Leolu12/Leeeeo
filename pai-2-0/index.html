<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12152a">
  <title>Pai 2.0 — um dia com a IA</title>
  <meta name="description" content="Pai 2.0: uma aventura em pixel art sobre usar inteligência artificial no trabalho e no dia a dia — com honestidade, bom humor e segurança.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect x='3' y='3' width='10' height='9' fill='%23f26b3a'/%3E%3Crect x='3' y='2' width='2' height='1' fill='%23f26b3a'/%3E%3Crect x='11' y='2' width='2' height='1' fill='%23f26b3a'/%3E%3Crect x='5' y='5' width='2' height='3' fill='%23fff'/%3E%3Crect x='9' y='5' width='2' height='3' fill='%23fff'/%3E%3Crect x='6' y='6' width='1' height='2' fill='%231a1830'/%3E%3Crect x='10' y='6' width='1' height='2' fill='%231a1830'/%3E%3Crect x='4' y='12' width='2' height='2' fill='%23c94a2a'/%3E%3Crect x='10' y='12' width='2' height='2' fill='%23c94a2a'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=Pixelify+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="brand">
        <span class="brand-dot" aria-hidden="true"></span>
        <span id="chap-label">Pai 2.0</span>
      </div>
      <nav class="tools" aria-label="Controles">
        <button id="btn-sound" class="tool" type="button" title="Ligar ou desligar o som"><span class="ic">🔊</span><span class="lb">Som: sim</span></button>
        <button id="btn-speed" class="tool" type="button" title="Velocidade do texto"><span class="ic">»</span><span class="lb">Texto: Normal</span></button>
        <button id="btn-font" class="tool" type="button" title="Tamanho da letra (A / A+ / A++)"><span class="ic">A+</span><span class="lb">Letra</span></button>
        <button id="btn-menu" class="tool" type="button" title="Menu (Esc)"><span class="ic">☰</span><span class="lb">Menu</span></button>
      </nav>
    </header>

    <main id="main">
      <div id="stage-wrap">
        <canvas id="stage" width="320" height="180" aria-label="Cena do jogo em pixel art"></canvas>
        <div id="hud" aria-live="off"></div>
        <div id="toasts" aria-live="polite"></div>
        <div id="stage-overlay" hidden></div>
        <button id="btn-skip" type="button" hidden>Pular cena ⏭</button>
      </div>

      <section id="panel" data-mode="dialog">
        <div id="dialog" class="dialog">
          <div id="dlg-portrait" hidden><canvas width="96" height="96" aria-hidden="true"></canvas></div>
          <div class="dlg-body">
            <div id="dlg-name" hidden></div>
            <div id="dlg-text"></div>
            <div id="dlg-next" aria-hidden="true">▼</div>
          </div>
          <div id="dlg-sr" class="sr-only" aria-live="polite"></div>
        </div>
        <div id="choices" hidden></div>
        <div id="chat" hidden></div>
        <div id="mini" hidden></div>
        <div id="panel-menu" hidden></div>
      </section>
    </main>

    <div id="screen" hidden></div>
    <div id="modal" hidden></div>
    <div id="overlay" hidden></div>
    <div id="menu" hidden></div>
    <div id="ach-toasts" aria-live="polite"></div>
    <noscript><div class="noscript">Este jogo precisa de JavaScript ligado no navegador.</div></noscript>
  </div>

  <!-- Motor -->
  <script src="js/engine/gfx.js"></script>
  <script src="js/engine/audio.js"></script>
  <!-- Arte -->
  <script src="js/art/sprites-people.js"></script>
  <script src="js/art/sprites-faisca.js"></script>
  <script src="js/art/bg-home.js"></script>
  <script src="js/art/bg-work.js"></script>
  <!-- Motor (cont.) -->
  <script src="js/engine/core.js"></script>
  <script src="js/engine/save.js"></script>
  <script src="js/engine/ui.js"></script>
  <script src="js/engine/director.js"></script>
  <!-- Conteúdo -->
  <script src="js/content/professions.js"></script>
  <script src="js/content/fontes.js"></script>
  <script src="js/content/achievements.js"></script>
  <!-- Capítulos -->
  <script src="js/chapters/prologo.js"></script>
  <script src="js/chapters/cap1.js"></script>
  <script src="js/chapters/cap2.js"></script>
  <script src="js/chapters/cap3.js"></script>
  <script src="js/chapters/cap4.js"></script>
  <script src="js/chapters/cap5.js"></script>
  <script src="js/chapters/cap6.js"></script>
  <script src="js/chapters/cap7.js"></script>
  <script src="js/chapters/cap8.js"></script>
  <script src="js/chapters/cap9.js"></script>
  <script src="js/chapters/epilogo.js"></script>
  <!-- Início -->
  <script src="js/main.js"></script>
</body>
</html>
